<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0e11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lean Cut">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<title>Lean Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#0c0e11; --raise:#16191e; --lift:#1d2128;
    --edge:#242a32; --edge-2:#323945;
    --ink:#f2f4f2; --ink-2:#c2c8cf; --muted:#79828d; --muted-2:#5b636d;
    --volt:#2fd4b4; --volt-ink:#04211c; --ember:#e8543a;
    --ui:'Barlow Semi Condensed','Segoe UI',system-ui,-apple-system,sans-serif;
    --num:'Barlow Condensed','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--ui);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  }
  html,body{margin:0;padding:0;background:var(--ground);}
  [hidden]{display:none!important;}
  .wrap{
    max-width:460px;margin:0 auto;
    padding-top:env(safe-area-inset-top,0px);
    padding-left:calc(16px + env(safe-area-inset-left,0px));
    padding-right:calc(16px + env(safe-area-inset-right,0px));
    padding-bottom:110px;
  }
  .build{
    text-align:center;font-size:11px;color:var(--muted-2);font-weight:700;
    letter-spacing:.4px;padding:22px 0 4px;
  }
  .build b{color:var(--volt);}
  button{font-family:inherit;color:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--volt);outline-offset:3px;border-radius:4px;}

  /* hero */
  .hero{padding:20px 0 16px;}
  .hero-day{
    margin:0 0 5px;font-size:11.5px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted-2);
  }
  .hero-focus{
    font-family:var(--num);font-size:46px;font-weight:700;line-height:.94;
    letter-spacing:-.015em;margin:0;text-wrap:balance;
  }
  .hero-note{margin:9px 0 0;font-size:13.5px;font-weight:500;color:var(--muted);}
  .hero-note b{
    font-family:var(--num);font-size:15px;color:var(--ink-2);font-weight:600;
    font-variant-numeric:tabular-nums;
  }

  /* sticky day strip + session spine */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ground);padding-top:2px;}
  .days{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;}
  .days::-webkit-scrollbar{display:none;}
  .day{
    flex:1 1 auto;min-width:40px;background:none;border:none;padding:6px 4px 8px;
    font-size:13px;font-weight:600;color:var(--muted-2);letter-spacing:.04em;
    text-transform:uppercase;position:relative;border-radius:6px;
  }
  .day .lbl{display:block;}
  .day.on{color:var(--ink);}
  .day.on::after{content:"";position:absolute;left:7px;right:7px;bottom:0;height:2px;background:var(--volt);border-radius:2px;}
  .day.today .lbl::before{
    content:"";position:absolute;top:2px;left:50%;margin-left:11px;
    width:4px;height:4px;border-radius:50%;background:var(--ember);
  }
  .day.fin .lbl{color:var(--muted);}
  .spine{display:flex;gap:9px;padding-bottom:12px;}
  .grp{display:flex;gap:3px;flex:1;}
  .spine i{flex:1;height:3px;border-radius:2px;background:var(--edge);transition:background .2s;}
  .spine i.done{background:var(--volt);}

  /* section heading */
  .eyebrow{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted-2);margin:24px 0 2px;
  }
  .eyebrow .n{font-family:var(--num);font-size:13px;letter-spacing:.04em;font-variant-numeric:tabular-nums;}
  .eyebrow.full .n{color:var(--volt);}

  /* one exercise */
  .item{border-bottom:1px solid var(--edge);}
  .group .item:last-child{border-bottom:none;}
  .row{display:flex;align-items:stretch;}
  .tick{
    flex:0 0 42px;display:flex;align-items:center;justify-content:flex-start;
    background:none;border:none;padding:0;
  }
  .tick .box{
    width:22px;height:22px;border-radius:6px;border:1.5px solid var(--edge-2);
    display:flex;align-items:center;justify-content:center;line-height:1;
    font-size:13px;font-weight:700;color:transparent;transition:background .15s;
  }
  .item.done .tick .box{background:var(--volt);border-color:var(--volt);color:var(--volt-ink);}
  .rowbody{
    flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-align:left;
    background:none;border:none;padding:15px 0;
  }
  .nm{flex:1;min-width:0;font-size:16.5px;font-weight:600;color:var(--ink-2);}
  .item.done .nm{color:var(--muted-2);}
  .tgt{
    font-family:var(--num);font-size:16px;font-weight:600;color:var(--muted);
    font-variant-numeric:tabular-nums;flex:0 0 auto;max-width:46%;text-align:right;
  }
  .item.done .tgt{color:var(--muted-2);}
  .chev{
    flex:0 0 12px;font-size:10px;color:var(--edge-2);line-height:1;
    transition:transform .2s;
  }
  .item.open .chev{transform:rotate(180deg);color:var(--volt);}

  /* expanded detail */
  .detail{padding:0 0 16px 42px;}
  .gear{
    font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);
  }
  .swapped{color:var(--ember);letter-spacing:.06em;}
  .cue{
    font-size:14px;color:var(--ink-2);line-height:1.5;margin:8px 0 0;
    padding-left:11px;border-left:2px solid var(--edge-2);
  }
  .aids{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .aids a,.aids button{
    background:var(--lift);border:1px solid var(--edge-2);border-radius:8px;
    padding:9px 14px;text-decoration:none;
    font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.01em;
  }
  .aids a:active,.aids button:active,.aids button.on{
    background:var(--volt);border-color:var(--volt);color:var(--volt-ink);
  }
  .aids .cnt{font-family:var(--num);font-size:12.5px;opacity:.6;margin-left:4px;}

  .swap{border-top:1px solid var(--edge);margin-top:12px;}
  .swap-h{
    font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted-2);padding:12px 0 2px;
  }
  .opt{
    width:100%;display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    background:none;border:none;border-bottom:1px solid var(--edge);padding:11px 0;text-align:left;
  }
  .opt:last-child{border-bottom:none;}
  .opt .n2{font-size:15px;font-weight:600;color:var(--ink-2);min-width:0;}
  .opt .w{font-size:12.5px;font-weight:500;color:var(--muted-2);text-align:right;flex:0 0 auto;max-width:46%;}
  .opt.on .n2{color:var(--volt);}

  .restday{border:1px solid var(--edge);border-radius:14px;padding:52px 24px;text-align:center;margin-top:8px;}
  .restday h2{font-family:var(--num);font-size:40px;font-weight:700;margin:0 0 10px;}
  .restday p{color:var(--muted);font-size:15px;line-height:1.6;margin:0;}

  .tip{
    font-size:13px;color:var(--muted);line-height:1.55;margin:26px 0 0;
    padding-left:11px;border-left:2px solid var(--edge-2);
  }
  .tip b{color:var(--ink-2);font-weight:600;}
  .foot{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--edge);}
  .foot button{
    flex:1;background:none;border:1px solid var(--edge);border-radius:9px;padding:12px;
    font-size:13px;font-weight:600;color:var(--muted);
  }

  /* bottom bar / rest */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--raise);
    border-top:1px solid var(--edge);padding:11px 16px calc(11px + env(safe-area-inset-bottom,0px));
  }
  .bar-in{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .tally{
    flex:1;font-family:var(--num);font-size:15px;font-weight:600;color:var(--muted);
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  .tally b{color:var(--ink);font-weight:700;}
  .mini{
    background:var(--lift);border:1px solid var(--edge-2);border-radius:9px;
    padding:10px 14px;font-size:13px;font-weight:600;color:var(--ink-2);
  }
  .rest{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--volt);color:var(--volt-ink);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  }
  .rest-in{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:16px;}
  .clock{
    font-family:var(--num);font-size:42px;font-weight:700;line-height:.9;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .rest .k{flex:1;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.62;}
  .skip{
    background:rgba(4,33,28,.16);border:none;border-radius:9px;padding:12px 16px;
    font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero" id="hero"></div>
  <div class="top">
    <div class="days" id="days"></div>
    <div class="spine" id="spine"></div>
  </div>
  <div id="view"></div>
  <div class="build">build <b>v21</b></div>
</div>

<div class="bar" id="bar"><div class="bar-in">
  <span class="tally" id="tally"></span>
  <button class="mini" type="button" onclick="startRest(90)">Rest 90s</button>
</div></div>

<div class="rest" id="rest" hidden><div class="rest-in">
  <span class="clock" id="clock">1:30</span>
  <span class="k">Resting</span>
  <button class="skip" type="button" onclick="stopRest()">Skip</button>
</div></div>

<script>

  wed:{label:"Wed",focus:"Cardio",
    warmup:[

      {n:"Leg Swings",eq:"body",m:"12 each leg",c:"Open the hips before you run",s:"leg swings hip mobility"}

    ],
    core:[

    ],
    cooldown:[

  thu:{label:"Thu",focus:"Shoulders & Arms",

      {n:"Bulgarian Split Squat",eq:"db",m:"8–12 each leg × 3 · 2 min",c:"Rear foot on a bench. Brutal, and the best single-leg builder there is",s:"bulgarian split squat dumbbell",alts:[{n:"Walking Lunges",eq:"db",w:"Less balance required",s:"dumbbell walking lunge"},{n:"Step Ups",eq:"db",w:"Kinder on the knees",s:"dumbbell step up"},{n:"Reverse Lunge",eq:"db",w:"Easiest on the knees",s:"dumbbell reverse lunge"}]},
      {n:"Seated Leg Curl",eq:"machine",m:"10–15 × 3 · 1 min",c:"Seated stretches the hamstring more than lying — worth having both in the week",s:"seated leg curl machine",alts:[{n:"Lying Leg Curl",eq:"machine",w:"If the seated one is taken",s:"lying leg curl machine"},{n:"Nordic Curl (assisted)",eq:"body",w:"No machine needed",s:"nordic hamstring curl assisted"}]},
      {n:"Leg Press (feet high)",eq:"machine",m:"10–15 × 3 · 2 min",c:"Feet high on the platform shifts work to glutes and hamstrings",s:"leg press feet high glutes",alts:[{n:"Leg Extension",eq:"machine",w:"Quads instead, if they feel behind",s:"leg extension machine"},{n:"Goblet Squat",eq:"db",w:"No machine needed",s:"goblet squat dumbbell"}]},

    warmup:[

      {n:"High Knees",eq:"body",m:"30 sec × 2",c:"Get the heart rate climbing",s:"high knees warm up drill"}
    ],
    cardio:[
      {n:"Treadmill Intervals",eq:"cardio",m:"1 min fast / 1 min walk × 8–10",c:"Hard but not a sprint — you should finish all ten rounds at the same pace",s:"treadmill hiit intervals",alts:[{n:"Bike Intervals",eq:"cardio",w:"Much easier on the joints",s:"stationary bike hiit intervals"},{n:"Rower Intervals",eq:"cardio",w:"Full body",s:"rowing machine intervals"}]},
      {n:"Incline Walk finisher",eq:"cardio",m:"10 min · moderate incline",c:"Bring the heart rate down gradually",s:"treadmill incline walk"}
    ],
    core:[
      {n:"Cable Crunch",eq:"cable",m:"12–15 × 3",c:"Round down through the spine, hips still. Add weight over the weeks",s:"kneeling cable crunch abs",alts:[{n:"Crunches",eq:"body",w:"If the cable is taken",s:"floor abdominal crunch"}]},
      {n:"Hanging Knee Raise",eq:"body",m:"10–15 × 3",c:"Curl the pelvis up, don't just swing the legs",s:"hanging knee raise abs",alts:[{n:"Lying Leg Raises",eq:"body",w:"If grip gives out first",s:"lying leg raise abs"}]},
      {n:"Plank",eq:"body",m:"45–60 sec × 3",c:"Add time each week, then hold a plate",s:"forearm plank hold",alts:[{n:"Side Plank",eq:"body",w:"Hits the obliques",s:"side plank hold"}]},
      {n:"Side Plank",eq:"body",m:"30 sec each side × 2",c:"Hips stacked and lifted",s:"side plank hold obliques",alts:[{n:"Cable Crunch",eq:"cable",w:"Loadable, builds the abs",s:"kneeling cable crunch abs"}]}
    ],
    cooldown:[
      {n:"Hamstring Stretch",eq:"body",m:"30 sec each leg",c:"Flat back",s:"standing hamstring stretch"},
      {n:"Hip Flexor Stretch",eq:"body",m:"30 sec each side",c:"Squeeze the back glute",s:"kneeling hip flexor stretch"},
      {n:"Calf Stretch",eq:"body",m:"30 sec each leg",c:"Back heel down",s:"wall calf stretch"},
      {n:"Child's Pose",eq:"body",m:"45 sec",c:"Breathe out and sink",s:"childs pose stretch"}
    ],
  },

  sun:{label:"Sun",focus:"Rest",rest:true},

const SECS=["warmup","lift","cardio","core","cooldown"];
const SEC={warmup:"Warm up",lift:"Lift",cardio:"Cardio",core:"Core",cooldown:"Cool down"};
const GEAR={machine:"Machine",db:"Dumbbell",barbell:"Barbell",cable:"Cable",body:"Bodyweight",cardio:"Cardio"};
const DAYNAME={mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",
               fri:"Friday",sat:"Saturday",sun:"Sunday"};
const order=["mon","tue","wed","thu","fri","sat","sun"];
const todayIdx=(new Date().getDay()+6)%7;
let viewing=order[todayIdx];
const open=new Set();
let swapFor=null;

/* storage: ticks reset daily, swaps persist */
const mem={};
function put(k,v){try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}}
function get(k){try{return localStorage.getItem(k);}catch(e){return mem[k]||null;}}
function readJSON(k,d){try{return JSON.parse(get(k)||"")||d;}catch(e){return d;}}
const stamp=()=>new Date().toISOString().slice(0,10);
const cKey=d=>`lc:done:${d}:${stamp()}`;
const wKey=d=>`lc:swap:${d}`;
const ticks=d=>readJSON(cKey(d),{});
const swaps=d=>readJSON(wKey(d),{});

/* the day's exercises, in the order you train them, swaps applied */
function items(day){
  const d=PLAN[day];if(d.rest)return[];
  const out=[],sw=swaps(day);
  SECS.forEach(sec=>(d[sec]||[]).forEach((base,i)=>{
    const id=`${sec}-${i}`, ai=sw[id], a=(base.alts||[])[ai];
    out.push({id,sec,base,alt:a?ai:undefined,
              ex:a?{...base,n:a.n,eq:a.eq,s:a.s,c:a.w}:base});
  }));
  return out;
}
/* search terms tuned per block, so "Plank" doesn't return yoga playlists */
function buildQuery(term,section){
  if(section==="cooldown"){
    const t=/stretch|pose/i.test(term)?term:term+" stretch";
    return {video:`how to do ${t} men proper form`,image:`man ${t} demonstration`};
  }
  if(section==="warmup")return {video:`${term} men warm up how to`,image:`man ${term} exercise gym`};
  if(section==="cardio")return {video:`${term} men how to gym`,image:`man ${term} gym`};
  return {video:`how to ${term} men proper form technique`,image:`man ${term} gym exercise form`};
}

/* ---------- render ---------- */
function render(){
  drawHero();drawDays();drawSpine();
  document.getElementById("view").innerHTML=viewDay();
  drawBar();
}
function drawHero(){
  const d=PLAN[viewing], all=items(viewing), t=ticks(viewing);
  const done=all.filter(it=>t[it.id]).length;
  document.getElementById("hero").innerHTML=
    `<p class="hero-day">${viewing===order[todayIdx]?"Today · ":""}${DAYNAME[viewing]}</p>
     <h1 class="hero-focus">${d.focus}</h1>
     ${all.length?`<p class="hero-note"><b>${done}</b> of <b>${all.length}</b> done</p>`:""}`;
}
function drawDays(){
  const s=document.getElementById("days");s.innerHTML="";
  order.forEach((k,i)=>{
    const b=document.createElement("button");
    b.type="button";b.className="day"+(k===viewing?" on":"")+(i===todayIdx?" today":"");
    const all=items(k),t=ticks(k);
    if(all.length&&all.every(it=>t[it.id]))b.classList.add("fin");
    b.innerHTML=`<span class="lbl">${PLAN[k].label}</span>`;
    b.onclick=()=>{viewing=k;open.clear();swapFor=null;render();window.scrollTo(0,0);};
    s.appendChild(b);
  });
}
function drawSpine(){
  const sp=document.getElementById("spine");sp.innerHTML="";
  if(PLAN[viewing].rest){sp.style.visibility="hidden";return;}
  sp.style.visibility="visible";
  const all=items(viewing),t=ticks(viewing);
  SECS.forEach(sec=>{
    const list=all.filter(it=>it.sec===sec);
    if(!list.length)return;
    const g=document.createElement("span");
    g.className="grp";g.style.flex=list.length;
    list.forEach(it=>{
      const i=document.createElement("i");
      if(t[it.id])i.className="done";
      g.appendChild(i);
    });
    sp.appendChild(g);
  });
}

function viewDay(){
  const d=PLAN[viewing];
  if(d.rest)return `<div class="restday"><h2>Rest</h2>
    <p>Nothing scheduled. Muscle is built while you recover, not while you lift.<br>Walk if you want to move.</p></div>`;
  const all=items(viewing),t=ticks(viewing);
  let h="";
  SECS.forEach(sec=>{
    const list=all.filter(it=>it.sec===sec);
    if(!list.length)return;
    const done=list.filter(it=>t[it.id]).length;
    h+=`<div class="eyebrow${done===list.length?" full":""}">
      <span>${SEC[sec]}</span><span class="n">${done}/${list.length}</span></div>
      <div class="group">${list.map(it=>itemHTML(it,!!t[it.id])).join("")}</div>`;
  });
  if((PLAN[viewing].lift||[]).length){
    h+=`<p class="tip">Hit the <b>top of the rep range on every set</b>? Add weight next
      session and start again at the bottom. That is the whole progression rule.</p>`;
  }
  h+=`<div class="foot">
    <button type="button" onclick="clearDay()">Clear ticks</button>
    <button type="button" onclick="undoSwaps()">Undo swaps</button></div>`;
  return h;
}

function itemHTML(it,done){
  const isOpen=open.has(it.id);
  let h=`<div class="item${done?" done":""}${isOpen?" open":""}">
    <div class="row">
      <button class="tick" type="button" aria-pressed="${done}"
        aria-label="${done?"Untick":"Tick"} ${it.ex.n}" onclick="toggleDone('${it.id}')">
        <span class="box">✓</span></button>
      <button class="rowbody" type="button" aria-expanded="${isOpen}" onclick="toggleOpen('${it.id}')">
        <span class="nm">${it.ex.n}</span>
        <span class="tgt">${it.base.m.split("·")[0].trim()}</span>
        <span class="chev">▼</span>
      </button>
    </div>`;
  if(isOpen){
    const q=buildQuery(it.ex.s,it.sec);
    const alts=(it.base.alts||[]);
    h+=`<div class="detail">
      <span class="gear">${GEAR[it.ex.eq]}${it.alt!==undefined?` <span class="swapped">· swapped</span>`:""}</span>
      ${it.ex.c?`<p class="cue">${it.ex.c}</p>`:""}
      <div class="aids">
        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q.video)}"
           target="_blank" rel="noopener">Watch</a>
        <a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(q.image)}"
           target="_blank" rel="noopener">Photos</a>
        ${alts.length?`<button type="button" class="${swapFor===it.id?"on":""}" onclick="toggleSwap('${it.id}')">Swap<span class="cnt">${alts.length}</span></button>`:""}
      </div>`;
    if(swapFor===it.id&&alts.length){
      h+=`<div class="swap"><div class="swap-h">Swap with</div>
        <button class="opt${it.alt===undefined?" on":""}" type="button" onclick="pickAlt('${it.id}',null)">
          <span class="n2">${it.base.n}</span><span class="w">As planned</span></button>`;
      alts.forEach((a,ai)=>{
        h+=`<button class="opt${it.alt===ai?" on":""}" type="button" onclick="pickAlt('${it.id}',${ai})">
          <span class="n2">${a.n}</span><span class="w">${a.w}</span></button>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;
  }
  return h+`</div>`;
}

/* ---------- actions ---------- */
function toggleDone(id){
  const t=ticks(viewing);
  if(t[id])delete t[id];else t[id]=1;
  put(cKey(viewing),JSON.stringify(t));
  render();
}
function toggleOpen(id){
  if(open.has(id))open.delete(id);else open.add(id);
  if(swapFor&&swapFor!==id)swapFor=null;
  render();
}
function toggleSwap(id){swapFor=swapFor===id?null:id;render();}
function pickAlt(id,idx){
  const s=swaps(viewing);
  if(idx===null)delete s[id];else s[id]=idx;
  put(wKey(viewing),JSON.stringify(s));
  swapFor=null;render();
}
function clearDay(){put(cKey(viewing),"{}");render();}
function undoSwaps(){put(wKey(viewing),"{}");swapFor=null;render();}

/* ---------- rest timer ---------- */
let tInt=null,tLeft=0;
const fmt=s=>Math.floor(s/60)+":"+String(Math.max(0,s%60)).padStart(2,"0");
function startRest(sec){
  stopRest();tLeft=sec;
  document.getElementById("rest").hidden=false;
  document.getElementById("bar").hidden=true;
  paint();
  tInt=setInterval(()=>{
    tLeft--;paint();
    if(tLeft<=0){stopRest();if(navigator.vibrate)navigator.vibrate([180,90,180]);}
  },1000);
}
function stopRest(){
  clearInterval(tInt);tInt=null;
  document.getElementById("rest").hidden=true;
  document.getElementById("bar").hidden=false;
}
function paint(){document.getElementById("clock").textContent=fmt(tLeft);}
function drawBar(){
  const bar=document.getElementById("bar");
  if(PLAN[viewing].rest){bar.hidden=true;return;}
  if(!tInt)bar.hidden=false;
  const all=items(viewing),t=ticks(viewing);
  document.getElementById("tally").innerHTML=
    `<b>${all.filter(it=>t[it.id]).length}</b> / ${all.length} done`;
}

/* the previous build keyed swaps as `swaps:<day>` with day-prefixed ids --
   bring those choices across once so nobody loses their substitutions */
(function migrateSwaps(){
  try{
    if(get("lc:migrated"))return;
    put("lc:migrated","1");
    order.forEach(day=>{
      if(get(wKey(day)))return;
      const old=readJSON(`swaps:${day}`,null);
      if(!old)return;
      const out={};
      Object.keys(old).forEach(k=>{
        out[k.startsWith(day+"-")?k.slice(day.length+1):k]=old[k];
      });
      if(Object.keys(out).length)put(wKey(day),JSON.stringify(out));
    });
  }catch(e){}
})();


/* swaps are stored by list position; v21 moved exercises within days, so
   clear saved swaps once rather than show a substitution on the wrong row */
(function resetStaleSwaps(){
  try{
    if(get("lc:swapv")==="2")return;
    order.forEach(day=>{try{localStorage.removeItem(wKey(day));}catch(e){delete mem[wKey(day)];}});
    put("lc:swapv","2");
  }catch(e){}
})();

render();
</script>

<script>
try{
  if (navigator.serviceWorker) {
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      if (reg.update) reg.update();
      reg.addEventListener("updatefound", function(){
        var sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", function(){
          if (sw.state === "activated" && navigator.serviceWorker.controller) location.reload();
        });
      });
    }).catch(function(){});
  }
}catch(e){}
</script>
