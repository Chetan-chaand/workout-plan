<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lean Cut</title>
<meta name="theme-color" content="#0d0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lean Cut">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<style>
  :root{
    /* dark deck with raised cards */
    --bg:#0d0f12;
    --card:#191d23;
    --card-2:#14171c;
    --raise:#1f242b;
    --ink:#f4f5f3;
    --ink-2:#c3c8d0;
    --muted:#868e99;
    --muted-2:#646c77;
    --line:#282e36;
    --line-2:#343b45;
    /* volt: the single loud colour */
    --volt:#2fd4b4;
    --volt-deep:#1fae93;
    --go:#3fa46a;
    --flag:#e8543a;
    /* olympic plate colours, lifted for dark */
    --pl-barbell:#e04b42;
    --pl-machine:#4a8ed6;
    --pl-db:#e0a92c;
    --pl-cable:#43a874;
    --pl-body:#9aa3ae;
    --pl-cardio:#a97ad6;
    /* layout */
    --app-w:480px;
    --rail-h:71px;
    --safe-t:env(safe-area-inset-top);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--ink);min-height:100vh;display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;max-width:var(--app-w);min-height:100vh;
    display:flex;flex-direction:column;background:var(--bg);
    padding-top:var(--safe-t);
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
    padding-bottom:calc(92px + env(safe-area-inset-bottom));
  }
  body.no-timer .app{padding-bottom:calc(16px + env(safe-area-inset-bottom));}
  a{color:inherit;}
  :focus-visible{outline:3px solid var(--volt);outline-offset:2px;}

  /* ---------- HERO ---------- */
  .hero{
    background:linear-gradient(160deg,#20252c 0%,#191d23 55%,#171a20 100%);
    border:1px solid var(--line-2);
    color:var(--ink);margin:10px 10px 0;border-radius:20px;
    padding:20px 22px 18px;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
    background:radial-gradient(circle,var(--volt) 0%,transparent 68%);opacity:.16;
  }
  .hero-day{font-size:13px;color:var(--muted);margin:0 0 5px;font-weight:600;letter-spacing:.2px;}
  .hero-focus{
    font-size:44px;font-weight:800;letter-spacing:-2px;line-height:.95;margin:0;color:#fff;
  }
  .hero-sub{
    display:inline-flex;align-items:baseline;gap:5px;margin-top:13px;
    font-size:13.5px;color:#04211c;font-weight:800;
    background:var(--volt);padding:7px 14px;border-radius:30px;
  }
  .hero-sub b{font-weight:800;font-variant-numeric:tabular-nums;}
  .week{display:flex;gap:4px;margin-top:14px;}
  .week i{flex:1;height:4px;border-radius:3px;background:#333a44;display:block;}
  .week i.done{background:var(--volt);}
  .week i.now{background:#fff;}

  /* ---------- DAY RAIL ---------- */
  .rail{
    display:flex;gap:5px;padding:14px 10px 11px;overflow-x:auto;
    position:sticky;top:var(--safe-t);z-index:30;scrollbar-width:none;
    background:var(--bg);border-bottom:1px solid var(--line);
    scroll-snap-type:x proximity;overscroll-behavior-x:contain;
  }
  @supports (backdrop-filter:blur(2px)){
    .rail{background:rgba(13,15,18,.82);backdrop-filter:blur(14px) saturate(140%);}
  }
  .rail::-webkit-scrollbar{display:none;}
  .rail button{
    flex:1 1 auto;min-width:38px;background:var(--card);border:1px solid var(--line);
    padding:10px 3px 9px;cursor:pointer;font-family:inherit;border-radius:12px;
    color:var(--muted);font-size:12.5px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;
    scroll-snap-align:center;
  }
  .rail button .mark{width:5px;height:5px;border-radius:50%;background:transparent;}
  .rail button.on{background:var(--volt);color:#04211c;border-color:var(--volt);}
  .rail button.fin .mark{background:var(--go);}
  .rail button.on.fin .mark{background:#04211c;}
  .rail button.now::after{
    content:"";position:absolute;top:5px;right:6px;width:5px;height:5px;
    border-radius:50%;background:var(--flag);
  }

  main{flex:1;padding:0 10px 14px;}
  .panel{display:none;}
  .panel.on{display:block;}

  /* ---------- METER ---------- */
  .meter{
    position:sticky;top:calc(var(--safe-t) + var(--rail-h));z-index:20;
    display:flex;align-items:center;gap:13px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 15px;margin-bottom:12px;
    box-shadow:0 0 0 10px var(--bg),0 10px 18px -14px #000;
  }
  .meter-line{flex:1;height:8px;background:var(--line-2);border-radius:5px;overflow:hidden;}
  .meter-line i{display:block;height:100%;background:var(--volt);width:0%;transition:width .3s;border-radius:5px;}
  .meter-txt{
    flex:0 0 auto;font-size:12.5px;color:var(--muted);font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:.2px;
  }
  .meter-txt.full{color:var(--volt);}

  /* ---------- SECTION ---------- */
  .sec{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:6px 17px 8px;margin-bottom:12px;
  }
  .sec.sub{background:var(--card-2);border-color:#22272e;}
  .sec-h{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 0 12px;border-bottom:2px solid var(--volt);
  }
  .sec.sub .sec-h{border-bottom-color:var(--line-2);}
  .sec-name{font-size:17px;font-weight:800;letter-spacing:-.4px;color:#fff;}
  .sec.sub .sec-name{color:var(--ink-2);}
  .sec-note{font-size:12.5px;color:var(--muted-2);font-weight:600;}

  /* ---------- ROW ---------- */
  .row{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
  .row:last-of-type{border-bottom:none;}
  .tick{
    width:44px;height:44px;flex:0 0 44px;border-radius:13px;
    border:2px solid var(--line-2);background:var(--raise);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:transparent;font-size:18px;font-weight:900;margin-top:1px;
    transition:background .15s,border-color .15s;
  }
  .tick.on{background:var(--volt);border-color:var(--volt);color:#04211c;}
  .body{flex:1;min-width:0;}
  .head{cursor:pointer;display:block;}
  .line1{
    display:grid;grid-template-columns:1fr auto 18px;
    align-items:start;gap:10px;
  }
  .nm{font-size:18.5px;font-weight:750;letter-spacing:-.4px;line-height:1.28;margin:0;color:#fff;overflow-wrap:break-word;}
  .row.done .nm{color:var(--muted-2);text-decoration:line-through;}
  .load{text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums;}
  .load .big{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1;display:block;color:#fff;}
  .load .sml{font-size:12px;color:var(--muted-2);font-weight:600;margin-top:5px;display:block;}
  .load.wide{max-width:115px;}
  .load.wide .big{font-size:14px;font-weight:700;line-height:1.35;letter-spacing:0;color:var(--muted);}
  .chev{
    flex:0 0 auto;width:18px;text-align:center;color:var(--line-2);
    font-size:10px;line-height:1;margin-top:8px;transition:transform .2s;display:inline-block;
  }
  .row.open .chev{transform:rotate(180deg);color:var(--volt);}
  .meta-line{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap;}
  .gear{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;color:var(--muted);font-weight:700;
  }
  .gear i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:0 0 9px;}
  .swapped{color:var(--flag);font-weight:800;}
  .last{
    font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;
    background:var(--raise);border:1px solid var(--line-2);padding:4px 9px;border-radius:7px;
  }
  .last b{font-weight:800;color:#fff;}
  .last .up{color:var(--volt);font-weight:800;}
  .more{display:none;padding-top:4px;}
  .row.open .more{display:block;}
  .cue{
    font-size:14px;color:var(--ink-2);line-height:1.55;margin-top:11px;
    padding-left:11px;border-left:3px solid var(--volt);
  }
  .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px;}
  .acts a,.acts button{
    background:var(--raise);border:1px solid var(--line-2);padding:11px 10px;border-radius:9px;
    font-family:inherit;cursor:pointer;font-size:13px;font-weight:700;
    color:var(--ink);text-decoration:none;text-align:center;
  }
  .acts a:active,.acts button:active{background:var(--volt);color:#04211c;border-color:var(--volt);}
  .acts .sw{background:var(--volt);color:#04211c;border-color:var(--volt);}

  /* compact warmup / cooldown */
  .sec.sub .nm{font-size:16.5px;font-weight:700;color:var(--ink);}
  .sec.sub .row{padding:13px 0;}
  .sec.sub .tick{width:38px;height:38px;flex:0 0 38px;border-radius:11px;font-size:16px;}
  .sec.sub .load .big{font-size:15px;color:var(--muted);}

  /* ---------- SWAP DRAWER ---------- */
  .drawer{display:none;margin-top:12px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:4px 13px;}
  .sec.sub .drawer{background:var(--raise);}
  .drawer.open{display:block;}
  .drawer-h{font-size:12px;color:var(--muted-2);font-weight:800;margin:11px 0 4px;}
  .opt{display:flex;align-items:center;gap:11px;padding:12px 0;cursor:pointer;border-bottom:1px solid var(--line);}
  .opt:last-child{border-bottom:none;}
  .opt-nm{flex:1;font-size:15px;font-weight:700;line-height:1.35;color:var(--ink);}
  .opt-why{display:block;font-size:12.5px;color:var(--muted-2);font-weight:500;margin-top:3px;}
  .opt.cur .opt-nm{color:var(--volt);}
  .opt-dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px;}

  /* ---------- WEIGHT LOG ---------- */
  .log{display:none;margin-top:12px;background:var(--raise);border:1px solid var(--line-2);border-radius:12px;padding:15px;}
  .log.open{display:block;}
  .log-h{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:11px;}
  .set-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .set-no{font-size:12.5px;color:var(--muted);font-weight:800;flex:0 0 42px;}
  .set-f{flex:1;position:relative;}
  .set-row input{
    width:100%;background:var(--bg);border:1.5px solid var(--line-2);border-radius:9px;
    color:#fff;font-family:inherit;font-size:16px;font-weight:700;padding:10px 11px;
    font-variant-numeric:tabular-nums;-moz-appearance:textfield;
  }
  .set-row input::-webkit-outer-spin-button,
  .set-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .set-row input:focus{border-color:var(--volt);outline:none;}
  .set-f span{
    position:absolute;right:11px;top:50%;transform:translateY(-50%);
    font-size:12px;color:var(--muted-2);font-weight:600;pointer-events:none;
  }
  .log-save{
    background:var(--volt);border:none;color:#04211c;font-size:13.5px;font-weight:800;
    padding:11px 20px;border-radius:9px;cursor:pointer;font-family:inherit;margin-top:6px;
  }
  .log-note{font-size:12px;color:var(--muted-2);margin-top:11px;line-height:1.5;}

  /* ---------- REST DAY ---------- */
  .rest{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:64px 28px;text-align:center;
  }
  .rest h2{font-size:38px;font-weight:800;letter-spacing:-1.4px;margin:0 0 14px;color:#fff;}
  .rest p{color:var(--muted);font-size:14.5px;line-height:1.65;margin:0;}

  /* ---------- FOOT / KEY ---------- */
  .foot{display:flex;gap:9px;padding:4px 0 14px;}
  .foot button{
    flex:1;background:var(--card);border:1px solid var(--line-2);padding:11px;border-radius:11px;
    font-family:inherit;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted);
  }
  .key{
    margin:0 10px 12px;overflow:hidden;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
  }
  .key-sum{
    list-style:none;cursor:pointer;padding:14px 17px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.3px;
  }
  .key-sum::-webkit-details-marker{display:none;}
  .key-sum::after{content:"\25BC";font-size:9px;color:var(--line-2);transition:transform .2s;}
  .key[open] .key-sum::after{transform:rotate(180deg);color:var(--volt);}
  .key-grid{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px 12px;
    padding:0 17px 16px;
  }
  .key-grid span{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);font-weight:700;}
  .key-grid i{width:10px;height:10px;border-radius:3px;flex:0 0 10px;}

  .build{
    text-align:center;font-size:11px;color:var(--muted-2);font-weight:700;
    padding:0 0 18px;letter-spacing:.4px;
  }
  .build b{color:var(--volt);}

  /* ---------- REST TIMER ---------- */
  .timer{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:var(--app-w);background:var(--raise);border-top:1px solid var(--line-2);
    padding:13px 16px calc(13px + env(safe-area-inset-bottom));z-index:40;
    border-radius:20px 20px 0 0;box-shadow:0 -14px 30px -18px #000;
  }
  .timer.off{display:none;}
  .timer.live{background:var(--volt);border-top-color:var(--volt);}
  .timer-drain{position:absolute;top:0;left:0;height:3px;background:var(--volt);width:0%;border-radius:20px 0 0 0;}
  .timer.live .timer-drain{background:#04211c;opacity:.3;}
  .timer-in{display:flex;align-items:center;gap:12px;}
  .clock{
    font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1.2px;
    min-width:72px;color:#fff;
  }
  .timer.live .clock{color:#04211c;}
  .presets{display:flex;gap:6px;flex:1;}
  .presets button{
    flex:1;background:transparent;border:1.5px solid var(--line-2);color:var(--muted);
    font-size:12.5px;font-weight:700;padding:9px 0;border-radius:9px;cursor:pointer;
    font-family:inherit;font-variant-numeric:tabular-nums;
  }
  .presets button.sel{border-color:#fff;color:#fff;}
  .timer.live .presets button{border-color:rgba(18,20,12,.28);color:rgba(18,20,12,.7);}
  .timer.live .presets button.sel{border-color:#04211c;color:#04211c;}
  .go{
    background:var(--volt);border:none;color:#04211c;font-size:13.5px;font-weight:800;
    padding:11px 19px;border-radius:9px;cursor:pointer;font-family:inherit;flex:0 0 auto;
  }
  .timer.live .go{background:#04211c;color:var(--volt);}

  /* ---------- DIET ---------- */
  .diet{margin-bottom:12px;}
  .macro-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .macro{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .macro.lead{grid-column:1 / -1;background:linear-gradient(150deg,#20252c,#191d23);border-color:var(--volt);}
  .macro-k{font-size:12.5px;color:var(--muted);font-weight:700;}
  .macro-v{
    font-size:32px;font-weight:800;letter-spacing:-1.5px;margin-top:6px;
    font-variant-numeric:tabular-nums;line-height:1;color:#fff;
  }
  .macro.lead .macro-v{color:var(--volt);font-size:40px;}
  .macro-n{font-size:12px;color:var(--muted-2);margin-top:8px;font-weight:600;line-height:1.45;}

  .prot-head{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 12px;}
  .prot-tot{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.8px;color:#fff;}
  .prot-tot.hit{color:var(--volt);}
  .prot-bar{height:8px;background:var(--line-2);border-radius:5px;overflow:hidden;margin-bottom:6px;}
  .prot-bar i{display:block;height:100%;background:var(--volt-deep);width:0%;transition:width .25s;border-radius:5px;}
  .prot-bar i.hit{background:var(--volt);}
  .food{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);}
  .food:last-of-type{border-bottom:none;}
  .food-nm{flex:1;font-size:16px;font-weight:700;line-height:1.3;color:var(--ink);}
  .food-g{font-size:12.5px;color:var(--muted-2);font-weight:600;display:block;margin-top:4px;}
  .food-ct{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  .food-ct button{
    width:44px;height:44px;border-radius:13px;border:2px solid var(--line-2);background:var(--raise);
    color:#fff;font-size:20px;font-weight:800;line-height:1;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
  }
  .food-ct button:active{background:var(--volt);color:#04211c;border-color:var(--volt);}
  .food-n{
    min-width:22px;text-align:center;font-size:18px;font-weight:800;
    font-variant-numeric:tabular-nums;color:var(--muted-2);
  }
  .food-n.up{color:var(--volt);}
  .diet-note{
    font-size:13px;color:var(--muted);line-height:1.65;padding:16px 0 4px;
    border-top:1px solid var(--line);margin-top:16px;
  }
  .diet-note b{color:#fff;}

  @media (max-width:359px){
    .line1{grid-template-columns:1fr 18px;gap:6px 10px;}
    .nm{grid-column:1;grid-row:1;}
    .chev{grid-column:2;grid-row:1;}
    .load,.load.wide{grid-column:1 / -1;grid-row:2;text-align:left;max-width:none;}
    .load .big,.load.wide .big{display:inline;font-size:15px;font-weight:700;letter-spacing:0;color:var(--ink-2);}
    .load .sml{display:inline;margin:0 0 0 8px;}
  }

  @media (min-width:600px){
    :root{--app-w:560px;}
    .macro-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .macro.lead{grid-column:span 2;}
    .key-grid{grid-template-columns:repeat(6,minmax(0,1fr));}
  }
  @media (min-width:900px){
    body{background:#07090b;}
    .app{border-left:1px solid var(--line);border-right:1px solid var(--line);}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <p class="hero-day" id="heroDay">—</p>
    <h1 class="hero-focus" id="heroFocus">—</h1>
    <div class="hero-sub" id="heroSub"></div>
    <div class="week" id="week"></div>
  </div>

  <nav class="rail" id="rail"></nav>
  <main id="panels"></main>

  <details class="key">
    <summary class="key-sum">Equipment colours</summary>
    <div class="key-grid">
      <span><i style="background:var(--pl-barbell)"></i>Barbell</span>
      <span><i style="background:var(--pl-machine)"></i>Machine</span>
      <span><i style="background:var(--pl-db)"></i>Dumbbell</span>
      <span><i style="background:var(--pl-cable)"></i>Cable</span>
      <span><i style="background:var(--pl-body)"></i>Bodyweight</span>
      <span><i style="background:var(--pl-cardio)"></i>Cardio</span>
    </div>
  </details>

  <div class="build">build <b>v17</b> · dark</div>

  <div class="timer" id="timerBar">
    <div class="timer-drain" id="drain"></div>
    <div class="timer-in">
      <div class="clock" id="clock">1:00</div>
      <div class="presets">
        <button onclick="setTimer(60)" id="p60" class="sel">60s</button>
        <button onclick="setTimer(90)" id="p90">90s</button>
        <button onclick="setTimer(120)" id="p120">2m</button>
      </div>
      <button class="go" id="goBtn" onclick="toggleTimer()">Start</button>
    </div>
  </div>
</div>

<script>
const PLAN = {
  mon:{label:"Mon",focus:"Chest",emoji:"💪",warmup:[
    {n:"Light Cardio",eq:"cardio",m:"5 min easy",c:"Treadmill or bike — just raise body temp",s:"treadmill light warm up jog"},

const PLATE={barbell:"#e04b42",machine:"#4a8ed6",db:"#e0a92c",cable:"#43a874",body:"#9aa3ae",cardio:"#a97ad6"};
const GEAR={machine:"Machine",db:"Dumbbell",barbell:"Barbell",cable:"Cable",body:"Bodyweight",cardio:"Cardio"};
const SEC={warmup:["Warm up","move, don't hold"],lift:["Lift",""],cardio:["Cardio",""],core:["Core",""],cooldown:["Cool down","hold each 30s"]};
const SECS=["warmup","lift","cardio","core","cooldown"];
const order=["mon","tue","wed","thu","fri","sat","sun"];
const rail=document.getElementById("rail"), panels=document.getElementById("panels");
const todayIdx=(new Date().getDay()+6)%7;
let viewing=order[todayIdx];

/* ---------- storage ---------- */
const mem={};
function hasLS(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true;}catch(e){return false;}}
const LS=hasLS();
const dstr=()=>new Date().toISOString().slice(0,10);
function put(k,v){try{LS?localStorage.setItem(k,v):mem[k]=v;}catch(e){mem[k]=v;}}
function get(k){try{return LS?localStorage.getItem(k):(mem[k]||null);}catch(e){return mem[k]||null;}}
const ckKey=d=>`workout:${d}:${dstr()}`;
const swKey=d=>`swaps:${d}`;

/* ---------- swaps ---------- */
function getSwaps(day){try{return JSON.parse(get(swKey(day))||"{}");}catch(e){return {};}}
function setSwap(day,id,idx){const s=getSwaps(day);if(idx===null)delete s[id];else s[id]=idx;put(swKey(day),JSON.stringify(s));}
function resolveEx(day,sec,i){
  const base=PLAN[day][sec][i], id=`${day}-${sec}-${i}`, sw=getSwaps(day);
  if(sw[id]===undefined) return {ex:base,swapped:false};
  const a=(base.alts||[])[sw[id]];
  if(!a) return {ex:base,swapped:false};
  return {ex:{...base,n:a.n,eq:a.eq,s:a.s,c:a.w},swapped:true};
}

/* ---------- search queries: male-focused, section aware ---------- */
function buildQuery(term,section){
  if(section==="cooldown"){
    const t=/stretch|pose/i.test(term)?term:term+" stretch";
    return {video:`how to do ${t} men proper form`,image:`man ${t} demonstration`};
  }
  if(section==="warmup") return {video:`${term} men warm up how to`,image:`man ${term} exercise gym`};
  if(section==="cardio") return {video:`${term} men how to gym`,image:`man ${term} gym`};
  return {video:`how to ${term} men proper form technique`,image:`man ${term} gym exercise form`};
}

/* ---------- split reps/sets for the numeral block ---------- */
function splitLoad(m){
  const parts=m.split("·").map(s=>s.trim());
  return {big:parts[0]||m, sml:parts.slice(1).join(" · ")};
}

/* ---------- render ---------- */
const OPEN=new Set();
function expand(id){
  const r=document.getElementById("row-"+id);
  if(!r) return;
  const nowOpen=r.classList.toggle("open");
  if(nowOpen) OPEN.add(id); else OPEN.delete(id);
}
function row(day,sec,i){
  const {ex,swapped}=resolveEx(day,sec,i);
  const id=`${day}-${sec}-${i}`;
  const q=buildQuery(ex.s,sec);
  const yt="https://www.youtube.com/results?search_query="+encodeURIComponent(q.video);
  const img="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(q.image);
  const base=PLAN[day][sec][i], alts=base.alts||[], sw=getSwaps(day), cur=sw[id];
  const L=splitLoad(ex.m);
  const loggable=(sec==="lift");
  const logLine=loggable?lastLine(ex.n):"";
  let logBox="";
  if(loggable){
    const t=todaySession(ex.n), l=lastSession(ex.n);
    const pre=t?t.sets:(l?l.sets:[]);
    let rows="";
    for(let si=0;si<4;si++){
      const p=pre[si]||{};
      rows+=`<div class="set-row">
        <span class="set-no">Set ${si+1}</span>
        <span class="set-f"><input id="w-${id}-${si}" type="number" inputmode="decimal" step="0.5" min="0"
          placeholder="" value="${p.w!==undefined?p.w:""}"><span>kg</span></span>
        <span class="set-f"><input id="r-${id}-${si}" type="number" inputmode="numeric" min="0"
          placeholder="" value="${p.r!==undefined?p.r:""}"><span>reps</span></span>
      </div>`;
    }
    logBox=`<div class="log" id="lg-${id}">
      <div class="log-h">Weight &amp; reps</div>${rows}
      <button class="log-save" onclick="commitLog('${id}',${JSON.stringify(ex.n)},'${day}')">Save</button>
      <div class="log-note">Pre-filled with last session. Beat one number — weight or reps — to progress.</div>
    </div>`;
  }

  let drawer="";
  if(alts.length){
    drawer=`<div class="drawer" id="dr-${id}"><div class="drawer-h">Swap with</div>
      <div class="opt ${cur===undefined?"cur":""}" onclick="pickAlt('${day}','${sec}',${i},null)">
        <span class="opt-dot" style="background:${PLATE[base.eq]}"></span>
        <div class="opt-nm">${base.n}<span class="opt-why">As planned</span></div>
      </div>`;
    alts.forEach((a,ai)=>{
      drawer+=`<div class="opt ${cur===ai?"cur":""}" onclick="pickAlt('${day}','${sec}',${i},${ai})">
        <span class="opt-dot" style="background:${PLATE[a.eq]}"></span>
        <div class="opt-nm">${a.n}<span class="opt-why">${a.w}</span></div>
      </div>`;
    });
    drawer+=`</div>`;
  }

  return `<div class="row${OPEN.has(id)?" open":""}" id="row-${id}">
    <div class="tick" id="tk-${id}" role="checkbox" tabindex="0" aria-label="${ex.n}"
         onclick="event.stopPropagation();toggle('${day}','${id}')"
         onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();event.stopPropagation();toggle('${day}','${id}');}"></div>
    <div class="body">
      <div class="head" onclick="expand('${id}')">
        <div class="line1">
          <p class="nm">${ex.n}</p>
          <div class="load${L.big.length>12?" wide":""}"><span class="big">${L.big}</span>${L.sml?`<span class="sml">${L.sml}</span>`:""}</div>
          <span class="chev">▼</span>
        </div>
        <div class="meta-line">
          <span class="gear"><i style="background:${PLATE[ex.eq]}"></i>${GEAR[ex.eq]}${swapped?' <span class="swapped">· swapped</span>':""}</span>
          ${logLine?`<span class="last">${logLine}</span>`:""}
        </div>
      </div>
      <div class="more">
        ${ex.c?`<div class="cue">${ex.c}</div>`:""}
        <div class="acts">
          <a href="${yt}" target="_blank" rel="noopener">Watch</a>
          <a href="${img}" target="_blank" rel="noopener">Photos</a>
          ${alts.length?`<button class="sw" onclick="openDrawer('${id}')">Swap</button>`:""}
          ${loggable?`<button class="sw" onclick="openLog('${id}')">Log</button>`:""}
        </div>
        ${logBox}
        ${drawer}
      </div>
    </div>
  </div>`;
}

function renderDay(day){
  const d=PLAN[day], p=document.getElementById("pn-"+day);
  if(d.rest) return;
  const total=SECS.reduce((a,s)=>a+((d[s]||[]).length),0);
  let h=`<div class="meter"><div class="meter-line"><i id="mt-${day}"></i></div>
    <span class="meter-txt" id="mx-${day}">0/${total}</span></div>`;
  SECS.forEach(sec=>{
    if(!d[sec]||!d[sec].length) return;
    const sub=(sec==="warmup"||sec==="cooldown")?" sub":"";
    h+=`<div class="sec${sub}"><div class="sec-h">
        <span class="sec-name">${SEC[sec][0]}</span>
        <span class="sec-note">${SEC[sec][1]}</span></div>`;
    d[sec].forEach((_,i)=>h+=row(day,sec,i));
    h+=`</div>`;
  });
  h+=`<div class="foot">
    <button onclick="resetDay('${day}')">Clear checkmarks</button>
    <button onclick="resetSwaps('${day}')">Undo swaps</button></div>`;
  p.innerHTML=h;
  loadChecks(day);
}

function openDrawer(id){const e=document.getElementById("dr-"+id);if(e)e.classList.toggle("open");}
function pickAlt(day,sec,i,idx){
  setSwap(day,`${day}-${sec}-${i}`,idx);
  renderDay(day);
  const e=document.getElementById(`dr-${day}-${sec}-${i}`);if(e)e.classList.add("open");
}
function resetSwaps(day){put(swKey(day),"{}");renderDay(day);}

/* ---------- build shell ---------- */
order.forEach((k,i)=>{
  const b=document.createElement("button");

function show(k){

/* the rail's height changes with font size / platform, so measure it instead
   of hard-coding the offset the sticky meter hangs from */
function syncRailHeight(){

  if(h) document.documentElement.style.setProperty("--rail-h",h+"px");

/* ---------- hero ---------- */
function paintHero(){
  if(viewing==="diet"){
    document.getElementById("heroDay").textContent="Daily targets";
    document.getElementById("heroFocus").textContent="Diet";
    const dd=getDiet();let tot=0;FOODS.forEach(f=>tot+=(dd[f.id]||0)*f.p);
    document.getElementById("heroSub").innerHTML=`<b>${tot}g</b> of <b>${TARGET.protein}g</b> protein today`;

    order.forEach((k,i)=>{const el=document.createElement("i");

      wkd.appendChild(el);});
    return;
  }
  const d=PLAN[viewing];
  const isToday=viewing===order[todayIdx];
  const names={mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",sat:"Saturday",sun:"Sunday"};
  document.getElementById("heroDay").textContent=isToday?"Today · "+names[viewing]:names[viewing];
  document.getElementById("heroFocus").textContent=d.focus;

  else{
    const total=SECS.reduce((a,s)=>a+((d[s]||[]).length),0);

  order.forEach((k,i)=>{

/* ---------- checks ---------- */
function toggle(day,id){
  const t=document.getElementById("tk-"+id), r=document.getElementById("row-"+id);
  const on=t.classList.toggle("on");
  t.textContent=on?"✓":"";
  r.classList.toggle("done",on);
  saveChecks(day);progress(day);
  if(on&&!tInt) startTimer();
}
function saveChecks(day){
  const st={};
  document.querySelectorAll(`#pn-${day} .tick`).forEach(t=>st[t.id]=t.classList.contains("on"));
  put(ckKey(day),JSON.stringify(st));
}
function loadChecks(day){
  let st=null;try{st=JSON.parse(get(ckKey(day))||"null");}catch(e){}
  if(st) Object.entries(st).forEach(([id,on])=>{
    if(!on)return;
    const t=document.getElementById(id), r=document.getElementById("row-"+id.replace("tk-",""));
    if(t){t.classList.add("on");t.textContent="✓";}
    if(r) r.classList.add("done");
  });
  progress(day);
}
function progress(day){
  const all=document.querySelectorAll(`#pn-${day} .tick`);
  if(!all.length)return;
  const done=document.querySelectorAll(`#pn-${day} .tick.on`).length;
  const bar=document.getElementById("mt-"+day);
  if(bar) bar.style.width=Math.round(done/all.length*100)+"%";
  const tx=document.getElementById("mx-"+day);
  if(tx){
    tx.textContent=done===all.length?`All ${all.length} done`:`${done}/${all.length}`;
    tx.classList.toggle("full",done===all.length);
  }
  const btn=document.querySelector(`.rail button[data-k="${day}"]`);
  if(btn) btn.classList.toggle("fin",done===all.length&&done>0);
  paintHero();
}
function resetDay(day){
  document.querySelectorAll(`#pn-${day} .tick`).forEach(t=>{t.classList.remove("on");t.textContent="";});
  document.querySelectorAll(`#pn-${day} .row`).forEach(r=>r.classList.remove("done"));
  saveChecks(day);progress(day);
}



/* ---------- weight log ---------- */
/* stored per exercise NAME so a swap keeps its own history */
const logKey=n=>"log:"+n.toLowerCase().replace(/[^a-z0-9]+/g,"-");
function getLog(name){try{return JSON.parse(get(logKey(name))||"[]");}catch(e){return [];}}
function saveLog(name,sets){
  const hist=getLog(name);
  const today=dstr();
  const entry={d:today,sets:sets};
  const i=hist.findIndex(e=>e.d===today);
  if(i>=0) hist[i]=entry; else hist.push(entry);
  while(hist.length>12) hist.shift();
  put(logKey(name),JSON.stringify(hist));
}
function lastSession(name){
  const h=getLog(name), today=dstr();
  for(let i=h.length-1;i>=0;i--) if(h[i].d!==today) return h[i];
  return null;
}
function todaySession(name){
  const h=getLog(name), today=dstr();
  return h.find(e=>e.d===today)||null;
}
function bestWeight(s){return s&&s.sets?Math.max(...s.sets.map(x=>x.w||0)):0;}
function lastLine(name){
  const t=todaySession(name), l=lastSession(name);
  if(t) {
    const up = l && bestWeight(t)>bestWeight(l);
    return `Today: <b>${t.sets.map(s=>`${s.w||0}×${s.r||0}`).join("  ")}</b>${up?' <span class="up">↑ up from last time</span>':""}`;
  }
  if(l) return `Last time: <b>${l.sets.map(s=>`${s.w||0}kg×${s.r||0}`).join("  ")}</b>`;
  return "";
}
function openLog(id,name){
  const el=document.getElementById("lg-"+id);
  if(el) el.classList.toggle("open");
}
function commitLog(id,name,day){
  const sets=[];
  for(let i=0;i<4;i++){
    const w=document.getElementById(`w-${id}-${i}`), r=document.getElementById(`r-${id}-${i}`);
    if(!w||!r) continue;
    const wv=parseFloat(w.value), rv=parseInt(r.value,10);
    if(!isNaN(wv)&&wv>0&&!isNaN(rv)&&rv>0) sets.push({w:wv,r:rv});
  }
  if(sets.length) saveLog(name,sets);
  renderDay(day);
}

/* ---------- diet ---------- */
const TARGET={kcal:2100,protein:140,fat:65,carbs:240};
const FOODS=[
  {id:"egg",  n:"Whole eggs",        unit:"per 2 eggs",     p:13},
  {id:"white",n:"Egg whites",        unit:"per 2 whites",   p:7},

  {id:"curd", n:"Curd / dahi",       unit:"per 200g bowl",  p:8},

  {id:"milk", n:"Milk",              unit:"per glass",      p:8},
];
const dietKey=()=>`diet:${dstr()}`;
function getDiet(){try{return JSON.parse(get(dietKey())||"{}");}catch(e){return {};}}
function setDiet(o){put(dietKey(),JSON.stringify(o));}

function renderDiet(){
  const p=document.getElementById("pn-diet");

  let h=`<div class="diet">
    <div class="macro-grid">
      <div class="macro lead"><div class="macro-k">Protein — the one that matters</div>
        <div class="macro-v">${TARGET.protein}g</div>
        <div class="macro-n">Protects muscle while you're in a deficit</div></div>
      <div class="macro"><div class="macro-k">Calories</div><div class="macro-v">${TARGET.kcal}</div>
        <div class="macro-n">~500 below maintenance</div></div>
      <div class="macro"><div class="macro-k">Fat</div><div class="macro-v">${TARGET.fat}g</div>
        <div class="macro-n">Hormones, don't go lower</div></div>
      <div class="macro"><div class="macro-k">Carbs</div><div class="macro-v">${TARGET.carbs}g</div>
        <div class="macro-n">Fuels your training</div></div>
      <div class="macro"><div class="macro-k">Target rate</div><div class="macro-v">0.5<span style="font-size:15px">kg/wk</span></div>
        <div class="macro-n">Faster means losing muscle too</div></div>
    </div>
  </div>

  <div class="sec"><div class="sec-h">
    <span class="sec-name">Protein today</span>
    <span class="sec-note">tap + as you eat</span></div>
    <div class="prot-head">
      <span class="macro-k">Running total</span>
      <span class="prot-tot" id="protTot">0g</span>
    </div>
    <div class="prot-bar"><i id="protBar"></i></div>`;
  FOODS.forEach(f=>{
    const n=d[f.id]||0;
    h+=`<div class="food">
      <div class="food-nm">${f.n}<span class="food-g">${f.p}g protein · ${f.unit}</span></div>
      <div class="food-ct">
        <button onclick="bump('${f.id}',-1)" aria-label="less ${f.n}">−</button>
        <span class="food-n ${n>0?"up":""}" id="fn-${f.id}">${n}</span>
        <button onclick="bump('${f.id}',1)" aria-label="more ${f.n}">+</button>
      </div></div>`;
  });
  h+=`<div class="diet-note">

function bump(id,dir){
  const d=getDiet();
  d[id]=Math.max(0,(d[id]||0)+dir);
  if(!d[id]) delete d[id];
  setDiet(d);
  const el=document.getElementById("fn-"+id);
  if(el){el.textContent=d[id]||0;el.classList.toggle("up",!!d[id]);}
  paintProtein();
}
function paintProtein(){
  const d=getDiet();
  let tot=0;
  FOODS.forEach(f=>tot+=(d[f.id]||0)*f.p);
  const t=document.getElementById("protTot"), b=document.getElementById("protBar");

  const hit=tot>=TARGET.protein;
  t.textContent=tot+"g";
  t.classList.toggle("hit",hit);
  b.style.width=Math.min(100,Math.round(tot/TARGET.protein*100))+"%";
  b.classList.toggle("hit",hit);
  if(viewing==="diet") paintHero();
}
function resetDiet(){setDiet({});renderDiet();}

/* ---------- rest timer ---------- */
let tSet=60,tLeft=60,tInt=null;
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function paintClock(){
  document.getElementById("clock").textContent=fmt(tLeft);
  document.getElementById("drain").style.width=(tInt?((tSet-tLeft)/tSet*100):0)+"%";
}
function setTimer(s){
  tSet=s;tLeft=s;stopTimer();paintClock();
  ["p60","p90","p120"].forEach(id=>document.getElementById(id).classList.remove("sel"));
  const el=document.getElementById("p"+s);if(el)el.classList.add("sel");
}
/* the rest timer is dead weight on the diet tab and on rest days --- hide it
   there (unless it is actually counting) and give the space back to the list */
function syncTimerBar(){
  const idle=!tInt;
  const off=idle&&(viewing==="diet"||(PLAN[viewing]&&PLAN[viewing].rest));
  document.getElementById("timerBar").classList.toggle("off",off);
  document.body.classList.toggle("no-timer",off);
}
function toggleTimer(){tInt?stopTimer():startTimer();}
function startTimer(){
  if(tLeft<=0)tLeft=tSet;
  document.getElementById("goBtn").textContent="Stop";
  document.getElementById("timerBar").classList.add("live");
  syncTimerBar();
  tInt=setInterval(()=>{
    tLeft--;paintClock();
    if(tLeft<=0){stopTimer();tLeft=tSet;paintClock();if(navigator.vibrate)navigator.vibrate([200,100,200]);}
  },1000);
  paintClock();
}

<script>
try{
  if (navigator.serviceWorker) {
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      // pull a fresh copy of the worker on every launch
      if (reg.update) reg.update();
      reg.addEventListener("updatefound", function(){
        var sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", function(){
          // a new build is ready and an old one was in charge -> reload into it
          if (sw.state === "activated" && navigator.serviceWorker.controller) location.reload();
        });
      });
    }).catch(function(){});
  }
}catch(e){}
</script>
