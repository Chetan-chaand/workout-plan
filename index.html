<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lean Cut</title>
<meta name="theme-color" content="#101215">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lean Cut">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<style>
  :root{
    /* surfaces: rubber gym flooring, cast iron */
    --floor:#101215;
    --deck:#191c21;
    --deck-2:#20242b;
    --ridge:#2c313a;
    /* chalk + steel */
    --chalk:#f7f6f3;
    --steel:#b3bac4;
    --steel-dim:#8d95a0;
    /* stencil paint accent */
    --paint:#e8b33c;
    --paint-deep:#c9902a;
    --go:#4f9d69;
    /* olympic plate colours */
    --pl-barbell:#c8322b;
    --pl-machine:#3272bd;
    --pl-db:#d9a327;
    --pl-cable:#3f8f5c;
    --pl-body:#d8d4c8;
    --pl-cardio:#8a919b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--floor);}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--chalk);min-height:100vh;display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;background:var(--floor);}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--paint);outline-offset:2px;}

  /* ---------- HERO: today's session ---------- */
  .hero{padding:26px 20px 20px;border-bottom:1px solid var(--ridge);}
  .hero-day{
    font-size:13px;color:var(--steel);letter-spacing:.2px;margin:0 0 2px;font-weight:600;
  }
  .hero-focus{
    font-size:40px;font-weight:800;letter-spacing:-1.4px;line-height:.98;margin:0;
  }
  .hero-sub{
    display:flex;align-items:baseline;gap:6px;margin-top:10px;
    font-size:13px;color:var(--steel);font-weight:600;
  }
  .hero-sub b{color:var(--chalk);font-weight:800;font-variant-numeric:tabular-nums;}
  .week{display:flex;gap:3px;margin-top:16px;}
  .week i{
    flex:1;height:3px;border-radius:2px;background:var(--ridge);display:block;
  }
  .week i.done{background:var(--go);}
  .week i.now{background:var(--paint);}

  /* ---------- DAY RAIL ---------- */
  .rail{
    display:flex;background:var(--deck);border-bottom:1px solid var(--ridge);
    position:sticky;top:0;z-index:30;
  }
  .rail button{
    flex:1;background:none;border:none;padding:15px 0 12px;cursor:pointer;font-family:inherit;
    color:var(--steel-dim);font-size:13.5px;font-weight:700;letter-spacing:.3px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    border-bottom:2px solid transparent;position:relative;
  }
  .rail button span.mark{width:4px;height:4px;border-radius:50%;background:transparent;}
  .rail button.on{color:var(--chalk);border-bottom-color:var(--paint);}
  .rail button.fin span.mark{background:var(--go);}
  .rail button.now::after{
    content:"";position:absolute;top:6px;left:50%;transform:translateX(9px);
    width:3px;height:3px;border-radius:50%;background:var(--paint);
  }

  main{flex:1;padding:0 0 96px;}
  .panel{display:none;}
  .panel.on{display:block;}

  /* ---------- PROGRESS ---------- */
  .meter{padding:20px 20px 4px;}
  .meter-line{height:2px;background:var(--ridge);position:relative;overflow:hidden;}
  .meter-line i{
    position:absolute;inset:0 auto 0 0;background:var(--paint);width:0%;
    transition:width .3s ease;display:block;
  }
  .meter-txt{
    margin-top:10px;font-size:13.5px;color:var(--steel);font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .meter-txt.full{color:var(--go);}

  /* ---------- SECTION ---------- */
  .sec{padding:30px 20px 0;}
  .sec-h{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:6px;padding-bottom:11px;border-bottom:1px solid var(--ridge);
  }
  .sec-name{font-size:17px;font-weight:800;letter-spacing:-.3px;color:var(--chalk);}
  .sec-note{font-size:12.5px;color:var(--steel-dim);font-weight:600;}

  /* ---------- EXERCISE ROW ---------- */
  .row{
    display:flex;gap:15px;padding:20px 0;border-bottom:1px solid rgba(44,49,58,.7);
    position:relative;
  }
  .row:last-of-type{border-bottom:none;}
  .tick{
    width:34px;height:34px;flex:0 0 34px;border-radius:10px;
    border:1.5px solid var(--ridge);background:var(--deck);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:transparent;font-size:17px;font-weight:900;margin-top:2px;
    transition:background .15s,border-color .15s;
  }
  .tick.on{background:var(--go);border-color:var(--go);color:#0f1a12;}
  .body{flex:1;min-width:0;}
  .line1{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .nm{font-size:18.5px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin:0;color:var(--chalk);}
  .row.done .nm{color:var(--steel-dim);text-decoration:line-through;}
  .load{
    text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums;
  }
  .load .big{font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1;display:block;color:var(--chalk);}
  .load.wide{max-width:132px;}
  .load.wide .big{font-size:14px;font-weight:700;line-height:1.35;letter-spacing:0;color:var(--steel);}
  .load .sml{font-size:12px;color:var(--steel-dim);font-weight:600;margin-top:5px;display:block;}
  .gear{
    display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    font-size:13px;color:var(--steel);font-weight:600;
  }
  .gear i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 10px;}
  .swapped{color:var(--paint);font-weight:700;}
  .cue{font-size:14px;color:var(--steel);line-height:1.55;margin-top:9px;}
  .acts{display:flex;gap:20px;margin-top:13px;}
  .acts a,.acts button{
    background:none;border:none;padding:0;font-family:inherit;cursor:pointer;
    font-size:13.5px;font-weight:700;color:var(--steel);text-decoration:none;
    border-bottom:1px solid var(--ridge);padding-bottom:3px;
  }
  .acts a:active,.acts button:active{color:var(--chalk);border-color:var(--steel);}
  .acts .sw{color:var(--paint);border-color:rgba(232,179,60,.35);}

  /* compact rows for warmup / cooldown */
  .sec.sub .nm{font-size:16.5px;font-weight:650;}
  .sec.sub .row{padding:15px 0;}
  .sec.sub .tick{width:30px;height:30px;flex:0 0 30px;border-radius:9px;font-size:15px;}
  .sec.sub .load .big{font-size:15px;color:var(--steel);}

  /* ---------- SWAP DRAWER ---------- */
  .drawer{display:none;margin-top:11px;border-left:2px solid var(--ridge);padding-left:12px;}
  .drawer.open{display:block;}
  .drawer-h{font-size:11.5px;color:var(--steel-dim);font-weight:700;margin-bottom:8px;}
  .opt{
    display:flex;align-items:center;gap:11px;padding:13px 0;cursor:pointer;
    border-bottom:1px solid rgba(44,49,58,.5);
  }
  .opt:last-child{border-bottom:none;}
  .opt-nm{flex:1;font-size:15px;font-weight:600;line-height:1.35;color:var(--chalk);}
  .opt-why{display:block;font-size:12.5px;color:var(--steel-dim);font-weight:500;margin-top:4px;}
  .opt.cur .opt-nm{color:var(--paint);}
  .opt-dot{width:8px;height:8px;border-radius:2px;flex:0 0 8px;}

  /* ---------- REST DAY ---------- */
  .rest{padding:80px 28px;text-align:center;}
  .rest h2{font-size:34px;font-weight:800;letter-spacing:-1px;margin:0 0 12px;}
  .rest p{color:var(--steel);font-size:14px;line-height:1.65;margin:0;}

  /* ---------- FOOT ---------- */
  .foot{display:flex;gap:20px;padding:26px 20px 8px;}
  .foot button{
    background:none;border:none;padding:0;font-family:inherit;cursor:pointer;
    font-size:12px;font-weight:700;color:var(--steel-dim);
    border-bottom:1px solid var(--ridge);padding-bottom:2px;
  }
  .key{
    display:flex;flex-wrap:wrap;gap:8px 14px;padding:20px 20px 28px;
    border-top:1px solid var(--ridge);margin-top:22px;
  }
  .key span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--steel-dim);font-weight:600;}
  .key i{width:8px;height:8px;border-radius:2px;}

  /* ---------- REST TIMER ---------- */
  .timer{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;background:var(--deck);border-top:1px solid var(--ridge);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));z-index:40;
  }
  .timer.live{background:var(--deck-2);border-top-color:var(--paint);}
  .timer-drain{
    position:absolute;top:0;left:0;height:2px;background:var(--paint);width:0%;
  }
  .timer-in{display:flex;align-items:center;gap:14px;}
  .clock{
    font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;
    min-width:74px;color:var(--steel);
  }
  .timer.live .clock{color:var(--paint);}
  .presets{display:flex;gap:7px;flex:1;}
  .presets button{
    flex:1;background:none;border:1px solid var(--ridge);color:var(--steel);
    font-size:12px;font-weight:700;padding:9px 0;border-radius:8px;cursor:pointer;font-family:inherit;
    font-variant-numeric:tabular-nums;
  }
  .presets button.sel{border-color:var(--steel-dim);color:var(--chalk);}
  .go{
    background:var(--paint);border:none;color:#1a1408;font-size:13px;font-weight:800;
    padding:10px 18px;border-radius:8px;cursor:pointer;font-family:inherit;flex:0 0 auto;
  }
  .timer.live .go{background:var(--ridge);color:var(--chalk);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <p class="hero-day" id="heroDay">—</p>
    <h1 class="hero-focus" id="heroFocus">—</h1>
    <div class="hero-sub" id="heroSub"></div>
    <div class="week" id="week"></div>
  </div>

  <nav class="rail" id="rail"></nav>
  <main id="panels"></main>

  <div class="key">
    <span><i style="background:#c8322b"></i>Barbell</span>
    <span><i style="background:#3272bd"></i>Machine</span>
    <span><i style="background:#d9a327"></i>Dumbbell</span>
    <span><i style="background:#3f8f5c"></i>Cable</span>
    <span><i style="background:#d8d4c8"></i>Bodyweight</span>
    <span><i style="background:#8a919b"></i>Cardio</span>
  </div>

  <div class="timer" id="timerBar">
    <div class="timer-drain" id="drain"></div>
    <div class="timer-in">
      <div class="clock" id="clock">1:00</div>
      <div class="presets">
        <button onclick="setTimer(60)" id="p60" class="sel">60s</button>
        <button onclick="setTimer(90)" id="p90">90s</button>
        <button onclick="setTimer(120)" id="p120">2m</button>
      </div>
      <button class="go" id="goBtn" onclick="toggleTimer()">Start</button>
    </div>
  </div>
</div>

const PLATE={barbell:"#c8322b",machine:"#3272bd",db:"#d9a327",cable:"#3f8f5c",body:"#d8d4c8",cardio:"#8a919b"};
const GEAR={machine:"Machine",db:"Dumbbell",barbell:"Barbell",cable:"Cable",body:"Bodyweight",cardio:"Cardio"};
const SEC={warmup:["Warm up","move, don't hold"],lift:["Lift",""],cardio:["Cardio",""],core:["Core",""],cooldown:["Cool down","hold each 30s"]};
const SECS=["warmup","lift","cardio","core","cooldown"];
const order=["mon","tue","wed","thu","fri","sat","sun"];
const rail=document.getElementById("rail"), panels=document.getElementById("panels");
const todayIdx=(new Date().getDay()+6)%7;
let viewing=order[todayIdx];

/* ---------- storage ---------- */
const mem={};
function hasLS(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true;}catch(e){return false;}}
const LS=hasLS();
const dstr=()=>new Date().toISOString().slice(0,10);
function put(k,v){try{LS?localStorage.setItem(k,v):mem[k]=v;}catch(e){mem[k]=v;}}
function get(k){try{return LS?localStorage.getItem(k):(mem[k]||null);}catch(e){return mem[k]||null;}}
const ckKey=d=>`workout:${d}:${dstr()}`;
const swKey=d=>`swaps:${d}`;

/* ---------- swaps ---------- */
function getSwaps(day){try{return JSON.parse(get(swKey(day))||"{}");}catch(e){return {};}}
function setSwap(day,id,idx){const s=getSwaps(day);if(idx===null)delete s[id];else s[id]=idx;put(swKey(day),JSON.stringify(s));}
function resolveEx(day,sec,i){
  const base=PLAN[day][sec][i], id=`${day}-${sec}-${i}`, sw=getSwaps(day);
  if(sw[id]===undefined) return {ex:base,swapped:false};
  const a=(base.alts||[])[sw[id]];
  if(!a) return {ex:base,swapped:false};
  return {ex:{...base,n:a.n,eq:a.eq,s:a.s,c:a.w},swapped:true};
}

/* ---------- search queries: male-focused, section aware ---------- */
function buildQuery(term,section){
  if(section==="cooldown"){
    const t=/stretch|pose/i.test(term)?term:term+" stretch";
    return {video:`how to do ${t} men proper form`,image:`man ${t} demonstration`};
  }
  if(section==="warmup") return {video:`${term} men warm up how to`,image:`man ${term} exercise gym`};
  if(section==="cardio") return {video:`${term} men how to gym`,image:`man ${term} gym`};
  return {video:`how to ${term} men proper form technique`,image:`man ${term} gym exercise form`};
}

/* ---------- split reps/sets for the numeral block ---------- */
function splitLoad(m){
  const parts=m.split("·").map(s=>s.trim());
  return {big:parts[0]||m, sml:parts.slice(1).join(" · ")};
}

/* ---------- render ---------- */
function row(day,sec,i){
  const {ex,swapped}=resolveEx(day,sec,i);
  const id=`${day}-${sec}-${i}`;
  const q=buildQuery(ex.s,sec);
  const yt="https://www.youtube.com/results?search_query="+encodeURIComponent(q.video);
  const img="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(q.image);
  const base=PLAN[day][sec][i], alts=base.alts||[], sw=getSwaps(day), cur=sw[id];
  const L=splitLoad(ex.m);

  let drawer="";
  if(alts.length){
    drawer=`<div class="drawer" id="dr-${id}"><div class="drawer-h">Swap with</div>
      <div class="opt ${cur===undefined?"cur":""}" onclick="pickAlt('${day}','${sec}',${i},null)">
        <span class="opt-dot" style="background:${PLATE[base.eq]}"></span>
        <div class="opt-nm">${base.n}<span class="opt-why">As planned</span></div>
      </div>`;
    alts.forEach((a,ai)=>{
      drawer+=`<div class="opt ${cur===ai?"cur":""}" onclick="pickAlt('${day}','${sec}',${i},${ai})">
        <span class="opt-dot" style="background:${PLATE[a.eq]}"></span>
        <div class="opt-nm">${a.n}<span class="opt-why">${a.w}</span></div>
      </div>`;
    });
    drawer+=`</div>`;
  }

  return `<div class="row" id="row-${id}">
    <div class="tick" id="tk-${id}" role="checkbox" tabindex="0" aria-label="${ex.n}"
         onclick="toggle('${day}','${id}')" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();toggle('${day}','${id}');}"></div>
    <div class="body">
      <div class="line1">
        <p class="nm">${ex.n}</p>
        <div class="load${L.big.length>12?" wide":""}"><span class="big">${L.big}</span>${L.sml?`<span class="sml">${L.sml}</span>`:""}</div>
      </div>
      <span class="gear"><i style="background:${PLATE[ex.eq]}"></i>${GEAR[ex.eq]}${swapped?' <span class="swapped">· swapped</span>':""}</span>
      ${ex.c?`<div class="cue">${ex.c}</div>`:""}
      <div class="acts">
        <a href="${yt}" target="_blank" rel="noopener">Watch</a>
        <a href="${img}" target="_blank" rel="noopener">Photos</a>
        ${alts.length?`<button class="sw" onclick="openDrawer('${id}')">Swap</button>`:""}
      </div>
      ${drawer}
    </div>
  </div>`;
}

function renderDay(day){
  const d=PLAN[day], p=document.getElementById("pn-"+day);
  if(d.rest) return;
  const total=SECS.reduce((a,s)=>a+((d[s]||[]).length),0);
  let h=`<div class="meter"><div class="meter-line"><i id="mt-${day}"></i></div>
    <div class="meter-txt" id="mx-${day}">0 of ${total} done</div></div>`;
  SECS.forEach(sec=>{
    if(!d[sec]||!d[sec].length) return;
    const sub=(sec==="warmup"||sec==="cooldown")?" sub":"";
    h+=`<div class="sec${sub}"><div class="sec-h">
        <span class="sec-name">${SEC[sec][0]}</span>
        <span class="sec-note">${SEC[sec][1]}</span></div>`;
    d[sec].forEach((_,i)=>h+=row(day,sec,i));
    h+=`</div>`;
  });
  h+=`<div class="foot">
    <button onclick="resetDay('${day}')">Clear checkmarks</button>
    <button onclick="resetSwaps('${day}')">Undo swaps</button></div>`;
  p.innerHTML=h;
  loadChecks(day);
}

function openDrawer(id){const e=document.getElementById("dr-"+id);if(e)e.classList.toggle("open");}
function pickAlt(day,sec,i,idx){
  setSwap(day,`${day}-${sec}-${i}`,idx);
  renderDay(day);
  const e=document.getElementById(`dr-${day}-${sec}-${i}`);if(e)e.classList.add("open");
}
function resetSwaps(day){put(swKey(day),"{}");renderDay(day);}

/* ---------- build shell ---------- */
order.forEach((k,i)=>{
  const b=document.createElement("button");
  b.dataset.k=k;
  b.innerHTML=`<span>${PLAN[k].label}</span><span class="mark"></span>`;
  if(i===todayIdx) b.classList.add("now");
  if(k===viewing) b.classList.add("on");
  b.onclick=()=>show(k);
  rail.appendChild(b);
});
order.forEach(k=>{
  const d=PLAN[k], p=document.createElement("div");
  p.className="panel";p.id="pn-"+k;
  if(k===viewing) p.classList.add("on");
  panels.appendChild(p);
  if(d.rest){
    p.innerHTML=`<div class="rest"><h2>Rest</h2>
      <p>Nothing scheduled. Muscle is built while you recover, not while you lift.<br>A walk is fine if you want to move.</p></div>`;
  } else renderDay(k);
});

function show(k){
  viewing=k;
  document.querySelectorAll(".rail button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="pn-"+k));
  paintHero();
  window.scrollTo({top:0,behavior:"instant"});
}

/* ---------- hero ---------- */
function paintHero(){
  const d=PLAN[viewing];
  const isToday=viewing===order[todayIdx];
  const names={mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",sat:"Saturday",sun:"Sunday"};
  document.getElementById("heroDay").textContent=isToday?"Today · "+names[viewing]:names[viewing];
  document.getElementById("heroFocus").textContent=d.focus;
  const sub=document.getElementById("heroSub");
  if(d.rest){sub.innerHTML="No session";}
  else{
    const total=SECS.reduce((a,s)=>a+((d[s]||[]).length),0);
    const done=document.querySelectorAll(`#pn-${viewing} .tick.on`).length;
    sub.innerHTML=`<b>${done}</b> of <b>${total}</b> done`;
  }
  const wk=document.getElementById("week");
  wk.innerHTML="";
  order.forEach((k,i)=>{
    const el=document.createElement("i");
    const btn=document.querySelector(`.rail button[data-k="${k}"]`);
    if(btn&&btn.classList.contains("fin")) el.classList.add("done");
    if(i===todayIdx) el.classList.add("now");
    wk.appendChild(el);
  });
}

/* ---------- checks ---------- */
function toggle(day,id){
  const t=document.getElementById("tk-"+id), r=document.getElementById("row-"+id);
  const on=t.classList.toggle("on");
  t.textContent=on?"✓":"";
  r.classList.toggle("done",on);
  saveChecks(day);progress(day);
  if(on&&!tInt) startTimer();
}
function saveChecks(day){
  const st={};
  document.querySelectorAll(`#pn-${day} .tick`).forEach(t=>st[t.id]=t.classList.contains("on"));
  put(ckKey(day),JSON.stringify(st));
}
function loadChecks(day){
  let st=null;try{st=JSON.parse(get(ckKey(day))||"null");}catch(e){}
  if(st) Object.entries(st).forEach(([id,on])=>{
    if(!on)return;
    const t=document.getElementById(id), r=document.getElementById("row-"+id.replace("tk-",""));
    if(t){t.classList.add("on");t.textContent="✓";}
    if(r) r.classList.add("done");
  });
  progress(day);
}
function progress(day){
  const all=document.querySelectorAll(`#pn-${day} .tick`);
  if(!all.length)return;
  const done=document.querySelectorAll(`#pn-${day} .tick.on`).length;
  const bar=document.getElementById("mt-"+day);
  if(bar) bar.style.width=Math.round(done/all.length*100)+"%";
  const tx=document.getElementById("mx-"+day);
  if(tx){
    tx.textContent=done===all.length?`Session complete — all ${all.length} done`:`${done} of ${all.length} done`;
    tx.classList.toggle("full",done===all.length);
  }
  const btn=document.querySelector(`.rail button[data-k="${day}"]`);
  if(btn) btn.classList.toggle("fin",done===all.length&&done>0);
  paintHero();
}
function resetDay(day){
  document.querySelectorAll(`#pn-${day} .tick`).forEach(t=>{t.classList.remove("on");t.textContent="";});
  document.querySelectorAll(`#pn-${day} .row`).forEach(r=>r.classList.remove("done"));
  saveChecks(day);progress(day);
}

/* ---------- rest timer ---------- */
let tSet=60,tLeft=60,tInt=null;
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function paintClock(){
  document.getElementById("clock").textContent=fmt(tLeft);
  document.getElementById("drain").style.width=(tInt?((tSet-tLeft)/tSet*100):0)+"%";
}
function setTimer(s){
  tSet=s;tLeft=s;stopTimer();paintClock();
  ["p60","p90","p120"].forEach(id=>document.getElementById(id).classList.remove("sel"));
  const el=document.getElementById("p"+s);if(el)el.classList.add("sel");
}
function toggleTimer(){tInt?stopTimer():startTimer();}
function startTimer(){
  if(tLeft<=0)tLeft=tSet;
  document.getElementById("goBtn").textContent="Stop";
  document.getElementById("timerBar").classList.add("live");
  tInt=setInterval(()=>{
    tLeft--;paintClock();
    if(tLeft<=0){stopTimer();tLeft=tSet;paintClock();if(navigator.vibrate)navigator.vibrate([200,100,200]);}
  },1000);
  paintClock();
}
function stopTimer(){
  clearInterval(tInt);tInt=null;
  document.getElementById("goBtn").textContent="Start";
  document.getElementById("timerBar").classList.remove("live");
  document.getElementById("drain").style.width="0%";
}
paintClock();paintHero();
</script>

if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function(){});
</script>
