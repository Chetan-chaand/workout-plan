<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Weekly Workout — Lean Cut</title>
  <meta name="theme-color" content="#141210">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lean Cut">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
<style>
  :root{
    --ink:#141210;
    --ink-soft:#231e19;
    --paper:#f1ece2;
    --steel:#4a4f55;
    --steel-soft:#6b7178;
    --rust:#c1440e;
    --rust-bright:#e05a1e;
    --rust-dim:#8a3009;
    --line:#ded5c1;
    --line-soft:#e9e1d0;
    --ok:#2f6b3c;
    --card:#fdfaf3;
    --eq-machine:#3557a0;
    --eq-db:#a0522d;
    --eq-barbell:#5a3d8a;
    --eq-cable:#0f766e;
    --eq-body:#8a6d1f;
    --eq-cardio:#b03a48;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--ink);}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--ink);min-height:100vh;display:flex;justify-content:center;
  }
  .app{
    width:100%;max-width:480px;background:var(--paper);
    min-height:100vh;display:flex;flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,.4);position:relative;
  }

  /* HEADER */
  header{
    background:linear-gradient(150deg,#1a1714,#241d17 60%,#2c211a);
    color:var(--paper);padding:22px 20px 16px;position:relative;overflow:hidden;
  }
  header::before{
    content:"";position:absolute;top:-50px;right:-50px;width:170px;height:170px;
    border-radius:50%;background:radial-gradient(circle,var(--rust) 0%,transparent 70%);opacity:.35;
  }
  .eyebrow{
    font-size:10px;letter-spacing:3.5px;text-transform:uppercase;
    color:var(--rust-bright);font-weight:800;margin:0 0 5px;
  }
  h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.05;}
  .week-strip{display:flex;gap:5px;margin-top:15px;}
  .week-dot{
    flex:1;height:4px;border-radius:3px;background:#3a322a;position:relative;
  }
  .week-dot.done{background:var(--ok);}
  .week-dot.today{background:var(--rust-bright);}
  .week-note{font-size:10.5px;color:#a89f90;margin-top:7px;letter-spacing:.3px;}

  /* NAV */
  nav.days{
    display:flex;background:var(--ink-soft);padding:0 4px;
    position:sticky;top:0;z-index:30;
  }
  nav.days button{
    flex:1;background:none;border:none;color:#948b7e;font-size:12.5px;font-weight:700;
    padding:13px 2px 10px;border-bottom:3px solid transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;
  }
  nav.days button .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
  nav.days button.active{color:#fff;border-bottom-color:var(--rust);}
  nav.days button.done .dot{background:var(--ok);}
  nav.days button.is-today::before{
    content:"";position:absolute;top:6px;right:calc(50% - 16px);
    width:4px;height:4px;border-radius:50%;background:var(--rust-bright);
  }

  main{flex:1;padding:18px 15px 90px;}
  .day-panel{display:none;animation:fade .22s ease;}
  .day-panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}

  .day-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;gap:10px;}
  .day-focus{font-size:21px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .day-count{
    font-size:11.5px;font-weight:700;color:var(--steel);
    background:#e7dec9;padding:4px 9px;border-radius:20px;white-space:nowrap;
  }
  .progress-wrap{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:6px;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--rust),var(--rust-bright));width:0%;transition:width .3s;border-radius:5px;}
  .progress-text{font-size:11px;color:var(--steel-soft);font-weight:600;margin-bottom:18px;}

  .section-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:2.5px;color:var(--rust-dim);
    font-weight:800;margin:22px 0 9px;display:flex;align-items:center;gap:8px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .section-label:first-of-type{margin-top:0;}

  /* EXERCISE CARD */
  .ex-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;margin-bottom:8px;transition:background .2s,border-color .2s;
  }
  .ex-card.checked{background:#eef4ee;border-color:#c3d9c6;}
  .ex-top{display:flex;align-items:flex-start;gap:11px;}
  .ex-check{
    width:26px;height:26px;border-radius:50%;border:2px solid var(--steel);flex:0 0 26px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:15px;color:transparent;font-weight:900;margin-top:1px;transition:all .15s;
  }
  .ex-check.on{background:var(--ok);border-color:var(--ok);color:#fff;}
  .ex-info{flex:1;min-width:0;}
  .ex-name-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px;}
  .ex-name{font-weight:700;font-size:14.5px;margin:0;}
  .ex-card.checked .ex-name{text-decoration:line-through;color:#5a6b5c;}
  .swapped-flag{
    font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    color:var(--rust-dim);background:#fbe6da;padding:2px 6px;border-radius:4px;
  }
  .eq-tag{
    font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    padding:2px 7px;border-radius:5px;color:#fff;white-space:nowrap;
  }
  .eq-machine{background:var(--eq-machine);}
  .eq-db{background:var(--eq-db);}
  .eq-barbell{background:var(--eq-barbell);}
  .eq-cable{background:var(--eq-cable);}
  .eq-body{background:var(--eq-body);}
  .eq-cardio{background:var(--eq-cardio);}
  .ex-meta{font-size:12.5px;color:var(--steel);font-weight:600;}
  .ex-cue{font-size:11.5px;color:var(--rust-dim);margin-top:5px;line-height:1.4;}
  .ex-actions{display:flex;gap:6px;margin-top:9px;}
  .btn-sm{
    flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
    font-size:11.5px;font-weight:700;text-decoration:none;padding:7px 6px;border-radius:7px;
    border:1px solid var(--line);color:var(--steel);background:#fff;cursor:pointer;
    font-family:inherit;
  }
  .btn-sm:active{background:#f3ece0;}
  .btn-sm.video{color:var(--rust-dim);border-color:#f0d3c2;background:#fdf3ec;}
  .btn-sm.swap{color:#2f4b7c;border-color:#cddaeb;background:#f2f6fc;}

  /* ALTERNATES PANEL */
  .alts{
    display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  }
  .alts.open{display:block;}
  .alts-title{
    font-size:10px;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--steel-soft);font-weight:800;margin-bottom:7px;
  }
  .alt-row{
    display:flex;align-items:center;gap:8px;padding:8px 9px;margin-bottom:5px;
    background:#fff;border:1px solid var(--line-soft);border-radius:8px;cursor:pointer;
  }
  .alt-row:active{background:#f4eee2;}
  .alt-row.current{border-color:var(--rust);background:#fdf3ec;}
  .alt-name{flex:1;font-size:12.5px;font-weight:600;}
  .alt-why{font-size:10.5px;color:var(--steel-soft);display:block;margin-top:2px;font-weight:400;}
  .alt-pick{
    font-size:9.5px;font-weight:800;color:var(--rust);text-transform:uppercase;letter-spacing:.5px;
  }

  /* REST TIMER BAR */
  .timer-bar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;background:var(--ink);color:#fff;
    padding:11px 16px calc(11px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:40;
    box-shadow:0 -4px 20px rgba(0,0,0,.25);
  }
  .timer-display{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;min-width:56px;}
  .timer-display.running{color:var(--rust-bright);}
  .timer-btns{display:flex;gap:6px;flex:1;justify-content:flex-end;}
  .timer-btn{
    background:#332a22;border:none;color:#e8e0d2;font-size:12px;font-weight:700;
    padding:8px 11px;border-radius:7px;cursor:pointer;font-family:inherit;
  }
  .timer-btn.primary{background:var(--rust);color:#fff;}
  .timer-label{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:#8f8779;font-weight:700;}

  /* REST DAY */
  .rest-day{text-align:center;padding:64px 24px;}
  .rest-day .big{font-size:52px;margin-bottom:8px;}
  .rest-day .day-focus{justify-content:center;margin-bottom:8px;}
  .rest-day p{color:var(--steel);font-size:14px;line-height:1.6;}

  .day-foot{display:flex;gap:8px;margin-top:20px;}
  .foot-btn{
    flex:1;background:none;border:1px solid var(--line);color:var(--steel);
    font-size:12px;font-weight:600;padding:10px;border-radius:22px;cursor:pointer;font-family:inherit;
  }
  .foot-btn:active{background:#e7dec9;}

  .legend{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;padding:4px 16px 6px;}
  .legend span{
    font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
    color:var(--steel);display:flex;align-items:center;gap:4px;
  }
  .legend span i{width:9px;height:9px;border-radius:2px;display:inline-block;}
  footer{text-align:center;font-size:10.5px;color:#8a8477;padding:6px 16px 16px;line-height:1.5;}
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="eyebrow">Belly Fat Loss · Lean Body</p>
    <h1>Weekly Workout</h1>
    <div class="week-strip" id="weekStrip"></div>
    <p class="week-note" id="weekNote">—</p>
  </header>

  <nav class="days" id="dayNav"></nav>
  <main id="mainPanels"></main>

  <div class="legend">
    <span><i style="background:#3557a0"></i>Machine</span>
    <span><i style="background:#a0522d"></i>Dumbbell</span>
    <span><i style="background:#5a3d8a"></i>Barbell</span>
    <span><i style="background:#0f766e"></i>Cable</span>
    <span><i style="background:#8a6d1f"></i>Bodyweight</span>
    <span><i style="background:#b03a48"></i>Cardio</span>
  </div>
  <footer>Tap <b>Swap</b> if a machine is busy or missing.<br>Checkmarks save automatically each day.</footer>

  <div class="timer-bar">
    <div>
      <div class="timer-label">Rest</div>
      <div class="timer-display" id="timerDisp">1:00</div>
    </div>
    <div class="timer-btns">
      <button class="timer-btn" onclick="setTimer(60)">60s</button>
      <button class="timer-btn" onclick="setTimer(90)">90s</button>
      <button class="timer-btn" onclick="setTimer(120)">2m</button>
      <button class="timer-btn primary" id="timerToggle" onclick="toggleTimer()">Start</button>
    </div>
  </div>
</div>

<script>

   alts: alternates — same muscle, different equipment */
const PLAN = {

           {n:"DB Flyes",eq:"db",w:"If cables are taken",s:"dumbbell chest fly"}]},

  tue:{label:"Tue",focus:"Back",emoji:"🎯",lift:[
    {n:"Pull Ups",eq:"body",m:"To failure × 3 · 1 min",c:"Hands wider than shoulders, chin over bar",s:"pull up proper form",
     alts:[{n:"Assisted Pull Up",eq:"machine",w:"Machine helps with bodyweight",s:"assisted pull up machine"},
           {n:"Lat Pulldown (wide)",eq:"machine",w:"Same movement, scalable weight",s:"wide grip lat pulldown"},
           {n:"Negative Pull Ups",eq:"body",w:"Jump up, lower slowly",s:"negative pull up"}]},
    {n:"Lat Pull Down",eq:"machine",m:"10–15 × 3 · 1 min",c:"Pull to upper chest, control the return",s:"lat pulldown machine",
     alts:[{n:"Straight Arm Pulldown",eq:"cable",w:"More lat isolation",s:"straight arm pulldown"},

    {n:"Seated Row Cable",eq:"cable",m:"10–15 × 3 · 1 min",c:"Pull to torso, squeeze shoulder blades",s:"seated cable row",
     alts:[{n:"Chest Supported Row",eq:"machine",w:"No lower-back strain",s:"chest supported row machine"},
           {n:"Bent Over Barbell Row",eq:"barbell",w:"Heavier, more total back",s:"bent over barbell row"}]},
    {n:"Single Arm Row DB",eq:"db",m:"10–15 × 3 · 1 min",c:"Flat back, pull elbow past torso",s:"single arm dumbbell row",

           {n:"Machine Row",eq:"machine",w:"Fixed path, easier form",s:"seated row machine"}]},
    {n:"T-Bar Row",eq:"barbell",m:"10–15 × 3 · 1 min",c:"Hinge at hips, flat back, pull to stomach",s:"t-bar row",
     alts:[{n:"Landmine Row",eq:"barbell",w:"Same angle, one corner of bar",s:"landmine row"},
           {n:"Chest Supported Row",eq:"machine",w:"If lower back is tired",s:"chest supported row machine"}]},

  ],cardio:[{n:"Cycling",eq:"cardio",m:"15–20 min · moderate",c:"Steady resistance",s:"stationary bike workout",

     {n:"Russian Twists",eq:"body",m:"20 × 3 (10/side)",c:"Lean back slightly, rotate from torso",s:"russian twist exercise",
     alts:[{n:"Cable Woodchopper",eq:"cable",w:"Standing rotation, more load",s:"cable woodchopper"},{n:"Side Plank",eq:"body",w:"Static oblique work",s:"side plank"}]}]},

  wed:{label:"Wed",focus:"Shoulders",emoji:"🔺",lift:[
    {n:"Overhead Press DB",eq:"db",m:"10–15 × 3 · 1 min",c:"Press straight up, don't flare elbows wide",s:"dumbbell shoulder press",
     alts:[{n:"Shoulder Press Machine",eq:"machine",w:"Fixed path, safer heavy",s:"shoulder press machine"},

           {n:"Arnold Press",eq:"db",w:"More front delt range",s:"arnold press"}]},
    {n:"Front Raise DB",eq:"db",m:"10–15 × 3 · 1 min",c:"Raise to shoulder height, slight elbow bend",s:"dumbbell front raise",

           {n:"Plate Front Raise",eq:"barbell",w:"Both hands on one plate",s:"plate front raise"}]},

    {n:"Arnold Press",eq:"db",m:"10–15 × 3 · 1 min",c:"Rotate palms in-to-out as you press up",s:"arnold press dumbbell",

           {n:"Machine Press",eq:"machine",w:"If shoulders feel tight",s:"shoulder press machine"}]},
    {n:"Rear Delt Fly",eq:"machine",m:"12–15 × 3 · 1 min",c:"Reverse pec deck, squeeze shoulder blades",s:"reverse pec deck rear delt fly",
     alts:[{n:"Bent Over DB Fly",eq:"db",w:"Free weight version",s:"bent over rear delt fly"},
           {n:"Face Pull",eq:"cable",w:"Rear delts + upper back",s:"cable face pull"}]},
    {n:"Shrugs DB",eq:"db",m:"12–15 × 3 · 1 min",c:"Lift shoulders straight up to ears, no rolling",s:"dumbbell shrugs traps",
     alts:[{n:"Barbell Shrugs",eq:"barbell",w:"Heavier loading",s:"barbell shrugs"},
           {n:"Cable Shrugs",eq:"cable",w:"Constant tension",s:"cable shrugs"}]}
  ],cardio:[{n:"Cross Trainer",eq:"cardio",m:"15–20 min · moderate",c:"Elliptical — use the handles",s:"cross trainer elliptical workout",
     alts:[{n:"Treadmill",eq:"cardio",w:"Higher burn",s:"treadmill workout"},{n:"Cycling",eq:"cardio",w:"Legs already fresh today",s:"stationary bike"}]}],
   core:[{n:"Plank",eq:"body",m:"45 sec × 3",c:"Straight line head to heels",s:"plank exercise form",
     alts:[{n:"Side Plank",eq:"body",w:"Obliques",s:"side plank"},{n:"Plank Shoulder Taps",eq:"body",w:"Adds anti-rotation",s:"plank shoulder tap"}]},
     {n:"Crunches",eq:"body",m:"20 × 3",c:"Lift shoulders only, don't pull neck",s:"crunches abs exercise",
     alts:[{n:"Cable Crunch",eq:"cable",w:"Weighted progression",s:"cable crunch"},{n:"Bicycle Crunch",eq:"body",w:"Obliques too",s:"bicycle crunch"}]}]},

  thu:{label:"Thu",focus:"Bi / Tri",emoji:"💥",lift:[
    {n:"Barbell Curl",eq:"barbell",m:"10–15 × 3 · 1 min",c:"Elbows pinned to sides, no swinging",s:"barbell bicep curl",
     alts:[{n:"EZ Bar Curl",eq:"barbell",w:"Easier on wrists",s:"ez bar curl"},
           {n:"DB Curl",eq:"db",w:"Fixes side-to-side imbalance",s:"dumbbell bicep curl"},
           {n:"Cable Curl",eq:"cable",w:"Constant tension",s:"cable bicep curl"}]},
    {n:"Hammer Curl DB",eq:"db",m:"10–15 × 3 · 1 min",c:"Palms face each other throughout",s:"hammer curl dumbbell",
     alts:[{n:"Rope Hammer Curl",eq:"cable",w:"Constant tension",s:"rope hammer curl"},
           {n:"Cross Body Curl",eq:"db",w:"More brachialis",s:"cross body hammer curl"}]},
    {n:"Preacher Curl",eq:"machine",m:"10–15 × 3 · 1 min",c:"Arm flat on pad, no momentum",s:"preacher curl",
     alts:[{n:"Concentration Curl",eq:"db",w:"Same strict isolation",s:"concentration curl"},
           {n:"Incline DB Curl",eq:"db",w:"Bigger stretch on bicep",s:"incline dumbbell curl"},
           {n:"Spider Curl",eq:"db",w:"Chest on incline bench",s:"spider curl"}]},
    {n:"Tricep Pushdown Cable",eq:"cable",m:"10–15 × 3 · 1 min",c:"Elbows pinned to sides, full extension",s:"tricep pushdown cable",

    {n:"Overhead Extension DB",eq:"db",m:"10–15 × 3 · 1 min",c:"Elbows in, lower behind head slowly",s:"overhead dumbbell tricep extension",
     alts:[{n:"Cable Overhead Ext.",eq:"cable",w:"Constant tension",s:"cable overhead tricep extension"},
           {n:"Skull Crushers",eq:"barbell",w:"Lying EZ-bar version",s:"skull crushers"}]},
    {n:"Tricep Single Hand DB",eq:"db",m:"10–15 × 3 · 1 min",c:"One arm overhead, elbow stays fixed",s:"single arm dumbbell tricep extension",
     alts:[{n:"Tricep Kickback",eq:"db",w:"Peak contraction focus",s:"tricep kickback"},
           {n:"Single Arm Pushdown",eq:"cable",w:"Cable version",s:"single arm tricep pushdown"}]}
  ],cardio:[{n:"Treadmill",eq:"cardio",m:"15–20 min · moderate",c:"Brisk walk or light jog",s:"treadmill workout",
     alts:[{n:"Cycling",eq:"cardio",w:"Lower impact",s:"stationary bike"},{n:"Cross Trainer",eq:"cardio",w:"Full body",s:"elliptical workout"}]}],
   core:[{n:"Leg Raises",eq:"body",m:"15 × 3",c:"Lower legs slow, don't arch lower back",s:"lying leg raises abs",
     alts:[{n:"Hanging Leg Raise",eq:"body",w:"Harder version",s:"hanging leg raise"},{n:"Reverse Crunch",eq:"body",w:"Easier on back",s:"reverse crunch"}]},
     {n:"Plank",eq:"body",m:"30 sec × 3",c:"Straight line head to heels",s:"plank exercise form",
     alts:[{n:"Side Plank",eq:"body",w:"Obliques",s:"side plank"},{n:"Knee Plank",eq:"body",w:"Easier",s:"knee plank"}]}]},

  fri:{label:"Fri",focus:"Legs",emoji:"🦵",lift:[
    {n:"Squats",eq:"barbell",m:"10–15 × 3 · 1 min",c:"Chest up, knees don't cave inward",s:"barbell back squat",
     alts:[{n:"Goblet Squat",eq:"db",w:"Easier to learn, upright torso",s:"goblet squat"},
           {n:"Hack Squat",eq:"machine",w:"Back supported, quad focus",s:"hack squat machine"},
           {n:"Smith Machine Squat",eq:"machine",w:"Fixed path, no spotter",s:"smith machine squat"}]},
    {n:"Front Squats",eq:"barbell",m:"10–15 × 3 · 1 min",c:"Bar on front shoulders, torso upright, brace core",s:"front squat barbell",
     alts:[{n:"Goblet Squat",eq:"db",w:"Same upright position, easier",s:"goblet squat"},
           {n:"Leg Extension",eq:"machine",w:"Pure quad isolation",s:"leg extension machine"},
           {n:"Bulgarian Split Squat",eq:"db",w:"Single leg, no bar needed",s:"bulgarian split squat"}]},
    {n:"Leg Press Wide",eq:"machine",m:"10–15 × 3 · 1 min",c:"Feet wide/high on platform, don't lock knees",s:"leg press wide stance",
     alts:[{n:"Leg Press Close",eq:"machine",w:"Shifts to outer quads",s:"leg press close stance"},
           {n:"Hack Squat",eq:"machine",w:"Similar pattern",s:"hack squat"},
           {n:"Goblet Squat",eq:"db",w:"If press is occupied",s:"goblet squat"}]},
    {n:"Lunges",eq:"db",m:"10–15 × 3 · 1 min",c:"Front knee tracks over ankle, not past toes",s:"dumbbell lunges",
     alts:[{n:"Bulgarian Split Squat",eq:"db",w:"Harder, more glute",s:"bulgarian split squat"},
           {n:"Walking Lunges",eq:"db",w:"Moving version",s:"walking lunges"},
           {n:"Step Ups",eq:"db",w:"Onto a bench",s:"dumbbell step ups"}]},
    {n:"RDL",eq:"db",m:"15–30 × 3 · 1 min",c:"Hinge at hips, flat back, feel hamstring stretch",s:"dumbbell romanian deadlift",
     alts:[{n:"Barbell RDL",eq:"barbell",w:"Heavier loading",s:"barbell romanian deadlift"},
           {n:"Good Mornings",eq:"barbell",w:"Bar on back, same hinge",s:"good mornings exercise"},
           {n:"Seated Leg Curl",eq:"machine",w:"If lower back is sore",s:"seated leg curl machine"}]},
    {n:"Lying Leg Curl",eq:"machine",m:"10–15 × 3 · 1 min",c:"Controlled curl, no hip lift off pad",s:"lying leg curl machine",
     alts:[{n:"Seated Leg Curl",eq:"machine",w:"Same muscle, seated",s:"seated leg curl machine"},
           {n:"Nordic Curl",eq:"body",w:"Bodyweight, very hard",s:"nordic hamstring curl"},
           {n:"DB Leg Curl",eq:"db",w:"DB between feet, lying",s:"dumbbell leg curl"}]},
    {n:"Standing Calf Raises",eq:"machine",m:"15–30 × 3 · 1 min",c:"Full stretch down, pause squeeze at top",s:"standing calf raise machine",
     alts:[{n:"Seated Calf Raise",eq:"machine",w:"Hits soleus more",s:"seated calf raise machine"},
           {n:"DB Calf Raise",eq:"db",w:"On a step, hold DBs",s:"dumbbell calf raise"},
           {n:"Leg Press Calf Raise",eq:"machine",w:"On the press platform",s:"leg press calf raise"}]}
  ],cardio:[{n:"Cycling",eq:"cardio",m:"15–20 min · moderate",c:"Steady resistance",s:"stationary bike workout",
     alts:[{n:"Cross Trainer",eq:"cardio",w:"Lower leg fatigue",s:"elliptical workout"},{n:"Incline Walk",eq:"cardio",w:"Easy on tired legs",s:"incline treadmill walk"}]}],
   core:[{n:"Crunches",eq:"body",m:"20 × 3",c:"Lift shoulders only, don't pull neck",s:"crunches abs exercise",
     alts:[{n:"Cable Crunch",eq:"cable",w:"Weighted",s:"cable crunch"},{n:"Bicycle Crunch",eq:"body",w:"Obliques",s:"bicycle crunch"}]}]},

  sat:{label:"Sat",focus:"HIIT + Core",emoji:"🔥",lift:[],
   cardio:[
    {n:"Treadmill Intervals",eq:"cardio",m:"1 min fast / 1 min walk × 8–10",c:"Push hard on fast minute, full recovery on walk",s:"treadmill HIIT intervals",
     alts:[{n:"Bike Sprints",eq:"cardio",w:"30s sprint / 90s easy",s:"stationary bike HIIT"},
           {n:"Rowing Intervals",eq:"cardio",w:"Full body, low impact",s:"rowing machine HIIT"},
           {n:"Stair Climber",eq:"cardio",w:"Steady high burn",s:"stair climber workout"}]},
    {n:"Incline Walk finisher",eq:"cardio",m:"10 min · moderate incline",c:"Steady pace, upright posture",s:"incline treadmill walk",
     alts:[{n:"Cross Trainer",eq:"cardio",w:"Low impact cooldown",s:"elliptical workout"},{n:"Easy Cycling",eq:"cardio",w:"Flush the legs",s:"stationary bike"}]}],
   core:[
    {n:"Plank",eq:"body",m:"45 sec × 3",c:"Straight line head to heels",s:"plank exercise form",
     alts:[{n:"Side Plank",eq:"body",w:"Obliques",s:"side plank"},{n:"Plank Shoulder Taps",eq:"body",w:"Anti-rotation",s:"plank shoulder tap"}]},
    {n:"Crunches",eq:"body",m:"20 × 3",c:"Lift shoulders only, don't pull neck",s:"crunches abs exercise",
     alts:[{n:"Cable Crunch",eq:"cable",w:"Weighted",s:"cable crunch"},{n:"Bicycle Crunch",eq:"body",w:"Obliques",s:"bicycle crunch"}]},
    {n:"Leg Raises",eq:"body",m:"15 × 3",c:"Lower legs slow, don't arch lower back",s:"lying leg raises abs",
     alts:[{n:"Hanging Leg Raise",eq:"body",w:"Harder",s:"hanging leg raise"},{n:"Reverse Crunch",eq:"body",w:"Easier on back",s:"reverse crunch"}]},
    {n:"Russian Twists",eq:"body",m:"20 × 3 (10/side)",c:"Lean back slightly, rotate from torso",s:"russian twist exercise",
     alts:[{n:"Cable Woodchopper",eq:"cable",w:"Standing, more load",s:"cable woodchopper"},{n:"Mountain Climbers",eq:"body",w:"Adds cardio",s:"mountain climbers"}]}]},

  sun:{label:"Sun",focus:"Rest",emoji:"😴",rest:true}
};

const EQ_LABEL={machine:"Machine",db:"Dumbbell",barbell:"Barbell",cable:"Cable",body:"Bodyweight",cardio:"Cardio"};
const order=["mon","tue","wed","thu","fri","sat","sun"];
const nav=document.getElementById("dayNav");
const main=document.getElementById("mainPanels");
const todayIdx=(new Date().getDay()+6)%7;

/* ---------- storage ---------- */
const mem={};
function hasLS(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true;}catch(e){return false;}}
const LS=hasLS();
function todayStr(){return new Date().toISOString().slice(0,10);}
function put(k,v){try{LS?localStorage.setItem(k,v):mem[k]=v;}catch(e){mem[k]=v;}}
function get(k){try{return LS?localStorage.getItem(k):(mem[k]||null);}catch(e){return mem[k]||null;}}
const checkKey=d=>`workout:${d}:${todayStr()}`;
const swapKey=d=>`swaps:${d}`;   // swaps persist across days

/* ---------- swaps ---------- */
function getSwaps(day){try{return JSON.parse(get(swapKey(day))||"{}");}catch(e){return {};}}
function setSwap(day,id,altIdx){
  const s=getSwaps(day);
  if(altIdx===null) delete s[id]; else s[id]=altIdx;
  put(swapKey(day),JSON.stringify(s));
}
function resolveEx(day,section,i){
  const base=PLAN[day][section][i];
  const id=`${day}-${section}-${i}`;
  const swaps=getSwaps(day);
  if(swaps[id]===undefined) return {ex:base,swapped:false};
  const alt=(base.alts||[])[swaps[id]];
  if(!alt) return {ex:base,swapped:false};
  return {ex:{...base,n:alt.n,eq:alt.eq,s:alt.s,c:alt.w},swapped:true};
}

/* ---------- build nav ---------- */
order.forEach((key,i)=>{
  const d=PLAN[key];
  const b=document.createElement("button");
  b.dataset.key=key;
  b.innerHTML=`<span>${d.label}</span><span class="dot"></span>`;
  if(i===todayIdx){b.classList.add("active","is-today");}
  b.onclick=()=>selectDay(key);
  nav.appendChild(b);
});

/* ---------- render ---------- */
function renderDay(key){
  const d=PLAN[key];
  const panel=document.getElementById("panel-"+key);
  if(d.rest) return;
  const total=d.lift.length+d.cardio.length+d.core.length;
  let html=`
    <div class="day-head">
      <div class="day-focus">${d.emoji} ${d.focus}</div>
      <div class="day-count">${total} exercises</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="bar-${key}"></div></div>
    <div class="progress-text" id="ptext-${key}">0 of ${total} done</div>`;
  ["lift","cardio","core"].forEach(sec=>{
    if(!d[sec].length) return;
    html+=`<div class="section-label">${sec}</div>`;
    d[sec].forEach((_,i)=>html+=exCard(key,sec,i));
  });
  html+=`<div class="day-foot">
      <button class="foot-btn" onclick="resetDay('${key}')">Reset checks</button>
      <button class="foot-btn" onclick="resetSwaps('${key}')">Reset swaps</button>
    </div>`;
  panel.innerHTML=html;
  loadChecks(key);
}

function exCard(day,section,i){
  const {ex,swapped}=resolveEx(day,section,i);
  const id=`${day}-${section}-${i}`;
  const yt="https://www.youtube.com/results?search_query="+encodeURIComponent("how to "+ex.s);
  const img="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(ex.s+" exercise");
  const base=PLAN[day][section][i];
  const alts=base.alts||[];
  const swaps=getSwaps(day);
  const cur=swaps[id];
  let altsHtml="";
  if(alts.length){
    altsHtml=`<div class="alts" id="alts-${id}">
      <div class="alts-title">Swap with</div>
      <div class="alt-row ${cur===undefined?"current":""}" onclick="pickAlt('${day}','${section}',${i},null)">
        <div class="alt-name">${base.n}<span class="alt-why">Original</span></div>
        <span class="eq-tag eq-${base.eq}">${EQ_LABEL[base.eq]}</span>
        ${cur===undefined?'<span class="alt-pick">✓</span>':""}
      </div>`;
    alts.forEach((a,ai)=>{
      altsHtml+=`<div class="alt-row ${cur===ai?"current":""}" onclick="pickAlt('${day}','${section}',${i},${ai})">
        <div class="alt-name">${a.n}<span class="alt-why">${a.w}</span></div>
        <span class="eq-tag eq-${a.eq}">${EQ_LABEL[a.eq]}</span>
        ${cur===ai?'<span class="alt-pick">✓</span>':""}
      </div>`;
    });
    altsHtml+=`</div>`;
  }
  return `
    <div class="ex-card" id="card-${id}">
      <div class="ex-top">
        <div class="ex-check" id="check-${id}" onclick="toggle('${day}','${id}')"></div>
        <div class="ex-info">
          <div class="ex-name-row">
            <p class="ex-name">${ex.n}</p>
            <span class="eq-tag eq-${ex.eq}">${EQ_LABEL[ex.eq]}</span>
            ${swapped?'<span class="swapped-flag">swapped</span>':""}
          </div>
          <div class="ex-meta">${ex.m}</div>
          ${ex.c?`<div class="ex-cue">💡 ${ex.c}</div>`:""}
          <div class="ex-actions">
            <a class="btn-sm video" href="${yt}" target="_blank" rel="noopener">▶ Demo</a>
            <a class="btn-sm" href="${img}" target="_blank" rel="noopener">🔍 Images</a>
            ${alts.length?`<button class="btn-sm swap" onclick="toggleAlts('${id}')">⇄ Swap</button>`:""}
          </div>
          ${altsHtml}
        </div>
      </div>
    </div>`;
}

function toggleAlts(id){
  const el=document.getElementById("alts-"+id);
  if(el) el.classList.toggle("open");
}
function pickAlt(day,section,i,altIdx){
  const id=`${day}-${section}-${i}`;
  setSwap(day,id,altIdx);
  renderDay(day);
  const el=document.getElementById("alts-"+id);
  if(el) el.classList.add("open");
}
function resetSwaps(day){
  put(swapKey(day),"{}");
  renderDay(day);
}

/* ---------- panels ---------- */
order.forEach(key=>{
  const d=PLAN[key];
  const p=document.createElement("div");
  p.className="day-panel";p.id="panel-"+key;
  if(key===order[todayIdx]) p.classList.add("active");
  main.appendChild(p);
  if(d.rest){
    p.innerHTML=`<div class="rest-day"><div class="big">${d.emoji}</div>
      <div class="day-focus">Rest Day</div>
      <p>No lifting, no cardio targets today.<br>A light walk is fine. Let the muscles recover and grow.</p></div>`;
  }else renderDay(key);
});

function selectDay(key){
  document.querySelectorAll("nav.days button").forEach(b=>b.classList.toggle("active",b.dataset.key===key));
  document.querySelectorAll(".day-panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+key));
}

/* ---------- checks ---------- */
function toggle(day,id){
  const c=document.getElementById("check-"+id), card=document.getElementById("card-"+id);
  const on=c.classList.toggle("on");
  c.textContent=on?"✓":"";
  card.classList.toggle("checked",on);
  saveChecks(day);updateProgress(day);
}
function saveChecks(day){
  const st={};
  document.querySelectorAll(`#panel-${day} .ex-check`).forEach(c=>st[c.id]=c.classList.contains("on"));
  put(checkKey(day),JSON.stringify(st));
}
function loadChecks(day){
  let st=null;
  try{st=JSON.parse(get(checkKey(day))||"null");}catch(e){}
  if(st) Object.entries(st).forEach(([id,on])=>{
    if(!on)return;
    const c=document.getElementById(id);
    const card=document.getElementById("card-"+id.replace("check-",""));
    if(c){c.classList.add("on");c.textContent="✓";}
    if(card) card.classList.add("checked");
  });
  updateProgress(day);
}
function updateProgress(day){
  const all=document.querySelectorAll(`#panel-${day} .ex-check`);
  if(!all.length)return;
  const done=document.querySelectorAll(`#panel-${day} .ex-check.on`).length;
  const bar=document.getElementById("bar-"+day);
  if(bar) bar.style.width=Math.round(done/all.length*100)+"%";
  const t=document.getElementById("ptext-"+day);
  if(t) t.textContent=done===all.length?`All ${all.length} done — nice work 🎉`:`${done} of ${all.length} done`;
  const btn=document.querySelector(`nav.days button[data-key="${day}"]`);
  if(btn) btn.classList.toggle("done",done===all.length&&done>0);
  updateWeekStrip();
}
function resetDay(day){
  document.querySelectorAll(`#panel-${day} .ex-check`).forEach(c=>{c.classList.remove("on");c.textContent="";});
  document.querySelectorAll(`#panel-${day} .ex-card`).forEach(c=>c.classList.remove("checked"));
  saveChecks(day);updateProgress(day);
}

/* ---------- week strip ---------- */
function updateWeekStrip(){
  const strip=document.getElementById("weekStrip");
  strip.innerHTML="";
  let doneCount=0;
  order.forEach((key,i)=>{
    const dot=document.createElement("div");
    dot.className="week-dot";
    if(!PLAN[key].rest){
      const btn=document.querySelector(`nav.days button[data-key="${key}"]`);
      if(btn&&btn.classList.contains("done")){dot.classList.add("done");doneCount++;}
    }
    if(i===todayIdx) dot.classList.add("today");
    strip.appendChild(dot);
  });
  document.getElementById("weekNote").textContent=
    doneCount?`${doneCount} of 6 sessions complete this week`:"6 sessions this week · 1 rest day";
}

/* ---------- rest timer ---------- */
let tSecs=60,tLeft=60,tInt=null;
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function paint(){document.getElementById("timerDisp").textContent=fmt(tLeft);}
function setTimer(s){tSecs=s;tLeft=s;stopTimer();paint();}
function toggleTimer(){tInt?stopTimer():startTimer();}
function startTimer(){
  if(tLeft<=0)tLeft=tSecs;
  document.getElementById("timerToggle").textContent="Pause";
  document.getElementById("timerDisp").classList.add("running");
  tInt=setInterval(()=>{
    tLeft--;paint();
    if(tLeft<=0){
      stopTimer();tLeft=tSecs;paint();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
    }
  },1000);
}
function stopTimer(){
  clearInterval(tInt);tInt=null;
  document.getElementById("timerToggle").textContent="Start";
  document.getElementById("timerDisp").classList.remove("running");
}
paint();
updateWeekStrip();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
</body>
